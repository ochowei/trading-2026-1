        state "Preregistered（已預先登記）" as StudyPreregistered
        state "Running（進行中）" as StudyRunning
        state "Paused（已暫停）" as StudyPaused
        state "Awaiting review（等待審查）" as AwaitingReview
        state "Completed（已完成）" as StudyCompleted
        state "Cancelled（已取消）" as StudyCancelled

        [*] --> StudyDraft: G-FAMILY + 建立權限 / CLI 配發 Sxxx
        StudyDraft --> StudyPreregistered: G-FAMILY + 完整計畫 + 人工核准 / 凍結指定版本與檔案
        StudyDraft --> StudyCancelled: 記錄原因
        StudyPreregistered --> StudyRunning: G-FAMILY + 凍結計畫有效 + Development 核准
        StudyPreregistered --> StudyCancelled: 記錄原因
        StudyRunning --> StudyPaused: 記錄原因
        StudyPaused --> StudyRunning: G-FAMILY + 凍結計畫有效 + 恢復核准
        StudyRunning --> AwaitingReview: 提交可核對的完整證據
        StudyRunning --> StudyCancelled: 記錄原因
        StudyPaused --> StudyCancelled: 記錄原因
        AwaitingReview --> StudyRunning: 審查者只做行政退回並記錄原因；後續執行仍受 G-FAMILY 限制
        AwaitingReview --> StudyCompleted: 審查者確認 / 凍結研究結果
        StudyCompleted --> [*]
        StudyCancelled --> [*]

        note right of StudyRunning
          凍結候選與其他會影響結果的動作：
          必須通過 G-FAMILY、凍結計畫檢查與該階段人工核准。
          一個階段的核准不能代替另一個階段。
        end note

        classDef l3 fill:var(--card),stroke:var(--viz-series-2),stroke-width:2px,color:var(--foreground)
        class StudyDraft,StudyPreregistered,StudyRunning,StudyPaused,AwaitingReview,StudyCompleted,StudyCancelled l3
          </pre>
          <div id="wgl-a13-mermaid-status" class="wgl-render-status text-small" aria-live="polite">正在整理 A1-3…</div>
        </section>
