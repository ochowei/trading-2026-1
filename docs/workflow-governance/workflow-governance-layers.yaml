    L1N4: {key: activity, label: 活動／處理步驟}
    L1N5: {key: activity, label: 活動／處理步驟}
    L2N1: {key: activity, label: 活動／處理步驟}
    L2N2: {key: decision, label: 決策／條件檢查}
    L2N3: {key: decision, label: 決策／條件檢查}
    L2N4: {key: activity, label: 活動／處理步驟}
    L2N5: {key: decision, label: 決策／條件檢查}
