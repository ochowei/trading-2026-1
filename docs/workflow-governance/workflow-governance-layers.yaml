  a1_2_node_layers:
    N01PORT: l1
    N02PORT: l2
    N06PORT: l3
    N01: l1
    N02: l2
    N03: l2
    N04: l3
    N05: l3
    N06: l3
  a1_2_shared_boundary_node_ids: [N02, N04]
  a1_2_zoom_controls_enabled: false
a1_details:
  L1N1:
    title: L1-N1｜接替版需求
    summary: 先整理為什麼要建立或修改接替版；此時只是 ENTRY-01 入口 context，還沒有正式版本路徑或版本狀態。
    input: 第一次建立 Workflow 的需求，或 Active 前一版產生的研究回饋、治理缺口與變更需求。開始整理接替版時，不要求先把研究全部安全化。
    next: 整理成內容完整的建立／變更需求，並明確說明接下來要建立接替版。
    guard: 接替版尚未取得正式路徑；前一版保持 Active，不會回到 Draft。依版本查詢的 CLI 不能回傳 ENTRY-01。
  L1N2:
    title: L1-N2｜AI 預覽與檢查
    summary: AI 讀取儲存庫與需求，產生不寫入檔案的預覽。
    input: 完整需求、同一流程系列的註冊表、Active 前一版、可能已存在的接替版 Draft、來源文件與治理規則。
    next: 確認預覽是否完整、可以套用，而且目標檔案從預覽後沒有改變。
    guard: 若目標已改變，或儲存庫處於不完整狀態，就停止且不寫入任何內容，重新產生預覽。
  L1N3:
    title: L1-N3｜預覽可套用？
    summary: 確認預覽內容完整，而且仍對應儲存庫的目前狀態。
    input: 預計修改的內容、明確路徑、目標檔案摘要、來源文件處置方式與驗證計畫。
    next: 人類確認可套用後，建立或維持同一個接替版 Draft；若不能套用，就保留目前狀態並重新預覽。
    guard: 不得略過目標變更、不完整狀態或預覽確認檢查，也不得只套用一部分修改。
  L1N4:
    title: L1-N4｜建立／修正草稿
    summary: 依已確認且仍有效的預覽，建立或更新一個完整註冊的接替版 Draft。
    input: 第一次建立的需求，或把前一版已接受的修改整合成接替版 Draft 的演進需求。
    next: 把同一個接替版 Draft 交給 L2 做發布檢查。
    guard: 接替版 Draft 尚未生效，也不能用來建立新的 L3 研究；同一流程系列的前一版仍保持 Active。
  L1N5:
    title: L1-N5｜修正輸入
    summary: 修正預覽失敗、資料缺漏或人類要求調整的內容。
    input: 缺漏、衝突、目標檔案已改變、儲存庫狀態不完整或修改意見；問題可能發生在 ENTRY-01，也可能發生在已存在的接替版 Draft。
    next: 重新整理需求，再回到 L1-N2 產生新預覽；已存在的接替版仍保留原本的版本身分。
    guard: 若預計修改的內容不同，舊預覽就不能再用，必須重新產生並確認；已存在的 Draft 也不能假裝回到尚無版本身分的 ENTRY-01。
  L2N1:
    title: L2-N1｜AI 發布檢查
    summary: CLI 與 Agent 檢查同一個 N02 接替版是否具備準備發布的條件。
    input: 完整 Workflow 規格、已接受的修改、整體影響、N02 接替版、Active 前一版的研究，以及固定的政策／相依版本。
    next: 把檢查結果交給 L2-N2；若前一版的安全或影響處理不完整，就暫時改處理 N06，後續以成對 safety artifacts 記錄開啟／關閉，再回原本 N02 重試。
    guard: 任何缺口都要停止發布。AI 檢查不能取代人工發布核准，也不能在重試時建立第二個接替版；v009 safety writer 只保存證據，不授予發布權限。
  L2N2:
    title: L2-N2｜發布條件通過？
    summary: 把結果分成三類：可以準備發布、要修正同一個 Draft，或要先處理前一版的安全問題。
    input: L2-N1 完整的發布就緒檢查結果。
    next: 通過就請求人類核准；接替版內容或固定版本有缺口就走 A12-A04；前一版的安全或暫停研究影響有缺口就走 A12-A12 到 N06，後續須建立 <code>ASSESSMENT.json</code>。
    guard: 研究安全只會阻止準備發布或啟用，不會阻止進入 ENTRY-01 context 或建立 N02 Draft；處理安全問題期間，接替版仍保持 N02。
  L2N3:
    title: L2-N3｜人工發布核准？
    summary: 由具穩定識別碼的人類明確核准這一次準備發布。
    input: 完整發布範圍、就緒檢查結果與整體影響。
    next: 核准後，為同一個接替版建立不可變的發布證據；未核准就修正或保留 Draft。
    guard: 這項核准只允許準備發布，不授權 commit、push、merge、研究或交易。
  L2N4:
    title: L2-N4｜準備發布
    summary: 依同一流程系列的啟用設定，選擇一般明確啟用路徑，或明文允許的舊版 bootstrap 例外。
    input: 通過所有檢查的 Draft，以及當下明確的人工發布核准。
    next: 需要明確啟用的版本會成為 Prepared，等待另一個人工啟用核准；只有早於邊界且設定明文允許的版本，才能走已凍結的 bootstrap 例外。
    guard: 需要明確啟用時，RELEASE.json 只證明已準備發布。前一版仍是註冊表中的 Active，但 Prepared 限制已阻止新的結果相關研究工作。
  L2N5:
    title: L2-N5｜人工啟用核准？
    summary: 由具穩定識別碼的人類，另外核准版本啟用（Workflow Release Activation）。
    input: Prepared 版本、不可變的 RELEASE.json、該次發布的摘要值與啟用影響。
    next: 核准後產生不可變的 ACTIVATION.json，讓接替版成為 Active；同一次轉換才把前一版改為 Superseded。未核准時繼續阻止新的結果相關研究工作。
    guard: 不得因為 Agent 判斷、RELEASE.json 已存在，或版本位於正式分支（canonical branch），就推定已啟用。
  L2N6:
    title: L2-N6｜正式權威生效
    summary: 接替版依同一流程系列要求的啟用證據，或明文允許的舊版 bootstrap 邊界，成為 Active。
    input: 適用且不可變的發布／啟用證據、相符的註冊表資料、固定版本，以及前一版的影響處理結果。
    next: 接替版以自己的版本身分進入 L3；只有此時，前一版才成為 Superseded。
    guard: 啟用不會把前一版與接替版合成同一個版本；某個同一流程系列的 bootstrap 例外也不能套用到需要明確啟用的版本。
  L2N7:
    title: L2-N7｜修正接替版
    summary: 修正接替版的規格、已接受修改、影響分析、固定版本或發布核准缺口。
    input: L2 停止發布時列出的缺口，或尚未取得人工核准的結果。
    next: 回到草稿編寫流程修正需求並重新預覽；已存在的 Draft 仍是 A12-N02，不會退回 ENTRY-01。
    guard: 不得重建或偷換接替版的版本身分，不得直接修改 Prepared 的發布證據，也不得略過重新確認。
  L2N8:
    title: L2-N8｜阻止新研究
    summary: Prepared 接替版尚未取得 Workflow Release Activation，因此維持停止新研究。
    input: 註冊表顯示 Prepared，而且還沒有相符的 ACTIVATION.json。
    next: 等待獨立人工啟用核准，再重新檢查 L2-N5。
    guard: Prepared 接替版還沒有 L3 權限；前一版也不得建立、預先登記、開始、恢復或凍結新的結果相關研究工作。
  L3N1:
    title: L3-N1｜研究治理就緒
    summary: 一個版本已依適用的發布邊界成為 Active，並以自己的版本身分進入研究治理。
    input: 依同一流程系列設定完成版本啟用的版本，或符合明文且已凍結 bootstrap 規則的邊界前版本，以及不可變證據與固定版本。
    next: 可以建立或推進 0..n 個彼此獨立的 Sxxx；每個 Sxxx 的生命週期請看 A1-3。
    guard: 此版本只能符合一個 L3 狀態；Draft 接替版可以並存。Prepared 接替版或未關閉的安全評估都會阻止新的結果相關研究工作。Safety writer／validator 已實作，但 v009 capability 要等 v009 Active 才生效。
  L3N2:
    title: L3-N2｜建立／推進零到多個 Sxxx
    summary: 在同一個 Active 版本下，分別管理多個獨立的 Sxxx 研究實例。
    input: L3 的有效權限，以及每個 Sxxx 自己的版本身分、計畫（plan）、人工核准與證據（evidence）。
    next: 每個 Sxxx 依 A1-3 獨立推進；即使開始整理接替版需求，Active 版本仍保持自己的 L3 狀態。
    guard: 不同 Sxxx 的固定版本、權限、計畫、證據與研究結果（outcome）不得混用；建立、預先登記、開始、恢復與凍結另受 G-FAMILY 及各階段人工核准約束。
  L3N3:
    title: L3-N3｜需要建立接替版？
    summary: 判斷研究回饋或治理缺口是否需要形成新的接替版需求。
    input: 研究結論、流程缺陷、治理需求，或人類提出的 Workflow 變更意圖。
    next: 不需要修改時，前一版繼續留在 L3；需要接替版時，立即以 HANDOFF ONLY 開始處理 ENTRY-01，前一版保持原本的 N04／N05。
    guard: Study 的研究結果只能形成接替版需求，不能直接覆寫已發布的前一版、讓它回到 Draft，或把 A12-A11 當成準備發布的授權。
  L3N4:
    title: L3-N4｜處理前一版的安全問題
    summary: 接替版已在 N02 並嘗試準備發布，因此流程暫時改去處理 Active 前一版的 N06。
    input: 由 <code>ASSESSMENT.json</code> 綁定的前一版／接替版 identity、不安全的 Sxxx，或尚未完成的暫停研究影響決定。
    next: 由研究操作人員（operator）／獨立審查者（reviewer）合法地讓研究進入 Paused、Completed 或 Cancelled，補齊影響決定，再檢查是否可建立 <code>CLEARANCE.json</code>。
    guard: Workflow 作者（Author）不能代替研究操作人員或獨立審查者。Artifacts、guarded writer 與 validator 已納入 v009 Draft；state-query CLI 只接受通過驗證的持久化證據，不會只靠說明文字或研究數量推定 N06。
  L3N5:
    title: L3-N5｜安全檢查完成？
    summary: 確認前一版的發布安全處理是否完整，以及是否可建立不可變的關閉證據。
    input: 前一版下所有 Sxxx 的正式生命週期狀態、每個暫停研究的影響決定，以及已保存的 <code>ASSESSMENT.json</code> identity／digest。
    next: 所有研究都安全、必要影響決定完整，且後續建立相符的 <code>CLEARANCE.json</code> 後，N06 才依未完成研究數回到 N04／N05；再回原本同一個 N02 接替版重做發布檢查。
    guard: 相符的關閉證據建立前維持 N06；不得另開 ENTRY-01 context 或建立第二個接替版，也不得讓前一版回到 Draft。Writer 只建立 add-only evidence，不會自動發布或啟用版本。
diagram_aria_labels:
  a1-main: A1：前一版保持 Active；流程可以先整理接替版需求。只有接替版準備發布時，才暫時改去處理前一版的安全問題；v009 contract 以 ASSESSMENT.json 與 CLEARANCE.json 記錄開啟及關閉。每個節點都可開啟詳細說明
  a1-2-overview: A1-2 Overview：ENTRY-01 是版本建立前的入口 context，N02 到 N06 是五個可持久化 control states；圖中另顯示舊版 bootstrap 例外、切換處理對象與發布安全協調
  a1-2a-identity-formation: A1-2A：ENTRY-01 入口 context 經過預覽、配發正式路徑並註冊後，才成為可判定的 N02 Draft 版本
  a1-2b-release-activation: A1-2B：接替版 Draft 依同一流程系列設定進入 Prepared 或 Active；若前一版有安全缺口，v009 capability 由成對 safety artifacts 記錄處理後回到原本同一個 Draft
  a1-2c-active-governance: A1-2C：同一個 Active 前一版只能符合 N04、N05、N06 其中一個；v009 Active 後，未關閉 assessment 優先判 N06，否則依未完成研究數判 N04 或 N05
  a1-study-state-machine: A1-3：單一 Sxxx 研究實例的七個狀態；建立、預先登記、開始、恢復與凍結等動作受 G-FAMILY 與各階段人工核准約束，Workflow 版本條件不會變成新的研究狀態
render_status:
  a1_mobile: 滑鼠停留顯示摘要；點選 A1 節點可在下方查看完整說明。
  a1_desktop: 滑鼠停留顯示摘要；聚焦或點選 A1 節點可在右欄查看完整說明。
  a1_2:
    a1-2-overview: Overview 已顯示 ENTRY-01 入口 context、N02–N06 五個可持久化 control states、舊版例外、A12-A11 切換處理對象，以及 A12-A12／A13 的發布安全協調；完整條件請看下方表格。
    a1-2a-identity-formation: A1-2A 已顯示 ENTRY-01 入口 context、A12-A01–A03 與 N02 共同邊界；只有 A12-A03 完成後，才有可依版本路徑判定的接替版。
    a1-2b-release-activation: A1-2B 已顯示 N02–N04、A12-A04–A07，以及 A12-A12／A13 暫時改處理前一版後，再回到同一個 N02；A12-A07 只接受相符的 ACTIVATION.json。
    a1-2c-active-governance: A1-2C 已顯示 N04–N06 與 A12-A08–A13；A12-A11 只開始處理新的 ENTRY-01 需求，A12-A12／A13 則回到原本同一個 N02 接替版。
  interaction_enabled: 可在 75%–200% 間縮放，並以拖曳、觸控或方向鍵移動。
  interaction_disabled: 縮放控制目前關閉；圖表維持 100%。
  a1_3: A1-3 仍是每一個 Sxxx 各自使用的七狀態生命週期。G-FAMILY、Prepared 接替版與進行中的安全評估只會限制可執行的動作，不是新的 Sxxx 狀態；safety writer／validator 已納入 v009 Draft，exact-version state CLI 已實作且不會把 Sxxx 狀態當成版本狀態。
  load_errors:
    a1: A1 載入失敗；上方仍可閱讀 Mermaid 原始文字。
    a1_2: 此 A1-2 分段圖載入失敗；上方仍可閱讀 Mermaid 原始文字。
    a1_3: A1-3 載入失敗；上方仍可閱讀 Mermaid 原始文字。
