  title: Workflow 治理層級
  header_html: |-
    <header class="wgl-header">
        <h1>Workflow 治理層級</h1>
      </header>
  sections_html:
    a1: |-
      <section class="wgl-diagram" aria-labelledby="wgl-switch-title">
          <h2 id="wgl-switch-title">A1｜Workflow 新舊版本如何接替</h2>
          <ul class="wgl-fsm-notation text-small" aria-label="A1 閱讀重點">
            <li><strong>前一版（predecessor）：</strong>目前是 Active（目前生效），之後可能被接替的版本。</li>
            <li><strong>接替版（successor）：</strong>準備接替前一版的新版本，可以是 Draft（草稿）或 Prepared（已準備、等待啟用）。</li>
            <li><strong>同一流程系列（workflow family）：</strong>同一套 Workflow 的所有版本，例如 v008 與 v009。A1-2 不會把整個系列合成一個狀態。</li>
            <li><strong>判定單位：</strong>每一個已建立的單一明確版本（exact version）都要分開判斷，而且只能符合 N02–N06 一個狀態；ENTRY-01 只是版本建立前的入口 context。</li>
            <li><strong>切換處理對象（handoff）：</strong>流程可以先去處理接替版，但不會改變前一版的狀態。</li>
            <li><strong>可以並存：</strong>前一版保持 Active 時，接替版可以同時處於 Draft 或 Prepared。</li>
            <li><strong>資料有問題時：</strong>資料不足或互相衝突就回報無法判定，不猜答案。</li>
            <li><strong>不在本圖的狀態：</strong>Superseded（已被接替）、Retired（已退役）與 Abandoned（已放棄）已離開目前的控制流程。</li>
          </ul>
          <ul class="wgl-node-legend text-small" aria-label="A1 節點視覺類型">
            <li><span class="wgl-node-legend-mark wgl-node-legend-input" aria-hidden="true"></span>輸入／觸發</li>
            <li><span class="wgl-node-legend-mark wgl-node-legend-activity" aria-hidden="true"></span>活動／處理</li>
            <li><span class="wgl-node-legend-mark wgl-node-legend-decision" aria-hidden="true"></span>決策／條件檢查</li>
            <li><span class="wgl-node-legend-mark wgl-node-legend-routing" aria-hidden="true"></span>路由／退回</li>
            <li><span class="wgl-node-legend-mark wgl-node-legend-state" aria-hidden="true"></span>狀態／條件</li>
          </ul>
          <div class="wgl-a1-layout">
            <div class="wgl-a1-figure">
              <pre class="mermaid wgl-mermaid wgl-mermaid-a1" data-diagram="a1-main">
      flowchart TB
        subgraph L1["L1｜提出接替版需求並建立草稿"]
          direction TB
          L1N1[/"L1-N1<br/>接替版需求"/] --> L1N2("L1-N2<br/>AI 預覽與檢查")
          L1N2 --> L1N3{"L1-N3<br/>預覽可套用？"}
          L1N3 -->|可套用／人工確認後| L1N4("L1-N4<br/>建立／修正草稿")
          L1N3 -->|失敗／要求修改| L1N5("L1-N5<br/>修正輸入")
          L1N5 -. 重新產生預覽 .-> L1N2
        end

        subgraph L2["L2｜接替版的發布與啟用"]
          direction TB
          L2N1("L2-N1<br/>AI 發布檢查") --> L2N2{"L2-N2<br/>發布條件通過？"}
          L2N2 -->|通過| L2N3{"L2-N3<br/>人工發布核准？"}
          L2N3 -->|核准| L2N4("L2-N4<br/>準備發布")
          L2N4 -->|需要另行啟用| L2N5{"L2-N5<br/>人工啟用核准？"}
          L2N4 -.->|舊版 bootstrap 例外（免另行啟用）| L2N6
          L2N5 -->|是；產生 ACTIVATION.json| L2N6(["L2-N6<br/>正式權威生效"])
          L2N2 -->|草稿、影響或固定版本資料有缺口| L2N7{{"L2-N7<br/>修正接替版"}}
          L2N3 -->|未核准| L2N7
          L2N5 -->|否| L2N8(["L2-N8<br/>阻止新研究"])
          L2N8 -. 等待啟用核准 .-> L2N5
        end

        subgraph L3["L3｜生效中版本的研究治理"]
          direction TB
          L3N1(["L3-N1<br/>研究治理就緒"]) --> L3N2("L3-N2<br/>建立／推進零到多個 Sxxx<br/>須通過 G-FAMILY 與各階段人工核准")
          L3N2 --> L3N3{"L3-N3<br/>需要建立接替版？"}
          L3N3 -->|否／繼續研究| L3N2
          L3N4("L3-N4<br/>處理前一版的安全問題<br/>建立 ASSESSMENT.json") --> L3N5{"L3-N5<br/>可建立 CLEARANCE.json？"}
          L3N5 -->|否；繼續處理安全問題／補齊影響紀錄| L3N4
        end

        L1N4 -->|把草稿交給發布檢查| L2N1
        L2N7 -. 保留同一接替版；修正後重試 .-> L1N2
        L2N2 -->|前一版的安全或影響處理未完成<br/>暫時改處理前一版| L3N4
        L2N6 -->|接替版成為 Active；前一版此時才 Superseded| L3N1
        L3N3 -.->|是／只切換處理對象<br/>前一版保持 N04／N05| L1N1
        L3N5 -.->|是／關閉證據成立後<br/>回到同一個 N02 接替版| L2N1
              </pre>
              <div id="wgl-mermaid-status" class="wgl-render-status text-small" aria-live="polite">正在整理 A1…</div>
            </div>
            <div class="wgl-a1-explorer">
            <div class="viz-controls">
              <label class="form-label" for="wgl-a1-detail-select">查看節點說明</label>
              <select id="wgl-a1-detail-select" class="form-select">
                <optgroup label="L1｜建立接替版">
                  <option value="L1N1">L1-N1｜接替版需求</option>
                  <option value="L1N2">L1-N2｜AI 預覽與檢查</option>
                  <option value="L1N3">L1-N3｜預覽可套用？</option>
                  <option value="L1N4">L1-N4｜建立／修正草稿</option>
                  <option value="L1N5">L1-N5｜修正輸入</option>
                </optgroup>
                <optgroup label="L2｜發布與啟用">
                  <option value="L2N1">L2-N1｜AI 發布檢查</option>
                  <option value="L2N2">L2-N2｜發布條件通過？</option>
                  <option value="L2N3">L2-N3｜人工發布核准？</option>
                  <option value="L2N4">L2-N4｜準備發布</option>
                  <option value="L2N5">L2-N5｜人工啟用核准？</option>
                  <option value="L2N6">L2-N6｜正式權威生效</option>
                  <option value="L2N7">L2-N7｜修正接替版</option>
                  <option value="L2N8">L2-N8｜阻止新研究</option>
                </optgroup>
                <optgroup label="L3｜Active 版本與研究協調">
                  <option value="L3N1">L3-N1｜研究治理就緒</option>
                  <option value="L3N2">L3-N2｜建立／推進零到多個 Sxxx</option>
                  <option value="L3N3">L3-N3｜需要建立接替版？</option>
                  <option value="L3N4">L3-N4｜處理前一版的安全問題</option>
                  <option value="L3N5">L3-N5｜安全檢查完成？</option>
                </optgroup>
              </select>
            </div>
            <section id="wgl-a1-detail-panel" class="card" aria-live="polite" aria-labelledby="wgl-a1-detail-title">
              <h3 id="wgl-a1-detail-title">L1-N1｜接替版需求</h3>
              <p id="wgl-a1-detail-summary">先整理為什麼要建立或修改接替版；此時還沒有正式版本路徑。</p>
              <dl class="wgl-a1-detail-grid text-small">
                <div><dt>節點類型</dt><dd id="wgl-a1-detail-type"></dd></div>
                <div><dt>輸入</dt><dd id="wgl-a1-detail-input"></dd></div>
                <div><dt>下一步</dt><dd id="wgl-a1-detail-next"></dd></div>
                <div><dt>限制／失敗處理</dt><dd id="wgl-a1-detail-guard"></dd></div>
              </dl>
            </section>
            </div>
          </div>
        </section>
    a1_2: |-
      <section class="wgl-diagram" aria-labelledby="wgl-aligned-state-machine-title">
          <h2 id="wgl-aligned-state-machine-title">A1-2｜五個可持久化 control states（N02–N06）</h2>
          <ul class="wgl-fsm-notation text-small" aria-label="A1-2 判定原則">
            <li><strong>判定單位：</strong>一次只判斷一個 <code>workflows/&lt;slug&gt;--vNNN</code> 版本，不把整個同一流程系列合成一個狀態。</li>
            <li><strong>唯一狀態：</strong>同一版本必須只符合 N02–N06 其中一個。零個或多個都回 invalid（資料矛盾）／indeterminate（資料不足），不可猜測。</li>
            <li><strong>可以並存：</strong>Active 前一版可與 Draft／Prepared 接替版同時存在；但 Prepared 接替版會阻止新的結果相關研究工作。</li>
            <li><strong>ENTRY-01 是入口 context：</strong>此時接替版尚未取得正式版本路徑，所以 ENTRY-01 不屬於 exact-version FSM，也不是已存在版本的持久化狀態。</li>
            <li><strong>切換處理對象：</strong><code>HANDOFF ONLY</code> 表示開始處理接替版，但前一版仍保持 Active，不會退回 Draft。</li>
            <li><strong>圖的關係：</strong>Overview、A、B、C 是同一套狀態機的不同視圖，不是四套狀態機。</li>
            <li><strong>範圍：</strong>已離開控制流程的註冊表（registry）狀態不在本圖；Sxxx 的生命週期只屬於 A1-3。</li>
          </ul>
          <ul class="wgl-node-legend text-small" aria-label="A1-2 所在層級">
            <li><span class="wgl-node-legend-mark wgl-node-legend-layer-l1" aria-hidden="true"></span>L1｜提出需求／編寫草稿</li>
            <li><span class="wgl-node-legend-mark wgl-node-legend-layer-l1-l2" aria-hidden="true"></span>L1→L2｜草稿編寫與發布檢查的共同邊界</li>
            <li><span class="wgl-node-legend-mark wgl-node-legend-layer-l2" aria-hidden="true"></span>L2｜準備發布／啟用</li>
            <li><span class="wgl-node-legend-mark wgl-node-legend-layer-l3" aria-hidden="true"></span>L3｜生效版本的研究治理</li>
          </ul>
          <ul class="wgl-fsm-notation text-small" aria-label="A1-2 圖例補充">
            <li><strong>線上的代號：</strong>圖上只顯示 action ID；完整成立條件與結果請看下方的動作對照表。</li>
            <li><strong>虛線：</strong>表示切換處理對象，或某個 family 明定的舊版例外；不是同一版本的一般狀態轉換。</li>
          </ul>

          <div class="wgl-a12-segments">
            <section class="wgl-a12-segment" aria-labelledby="wgl-a12-overview-title">
              <h3 id="wgl-a12-overview-title">A1-2 Overview｜ENTRY-01 入口與五個可持久化版本狀態</h3>
              <ul class="wgl-fsm-notation text-small" aria-label="A1-2 Overview 說明">
                <li>ENTRY-01 是接替版尚未建立前的入口 context；N02–N06 才是單一明確版本的五個可持久化 control states。</li>
                <li>依 exact version path 查詢時，只能回 N02–N06、invalid、indeterminate，或已離開本圖範圍；不能回 ENTRY-01。</li>
                <li>舊版 bootstrap 例外（既定舊版本可免另行啟用）、切換處理對象與發布安全協調也會顯示；細節請看 A／B／C 與下方動作對照表。</li>
              </ul>
              <div class="wgl-zoom-panel" data-zoom-pan data-zoom-label="A1-2 Overview">
                <div class="wgl-zoom-controls" role="group" aria-label="A1-2 Overview 圖表縮放控制">
                  <span class="wgl-zoom-controls-label text-small">圖表縮放</span>
                  <button class="btn wgl-zoom-out" type="button" aria-controls="wgl-a12-overview-viewport" aria-label="縮小 A1-2 Overview 圖表" title="縮小">−</button>
                  <button class="btn wgl-zoom-reset" type="button" aria-controls="wgl-a12-overview-viewport" aria-label="重設 A1-2 Overview 圖表縮放" title="重設為 100%">100%</button>
                  <button class="btn wgl-zoom-in" type="button" aria-controls="wgl-a12-overview-viewport" aria-label="放大 A1-2 Overview 圖表" title="放大">+</button>
                  <span class="wgl-zoom-announcement sr-only" aria-live="polite">A1-2 Overview 圖表縮放 100%</span>
                </div>
                <p id="wgl-a12-overview-help" class="wgl-fsm-notation text-small">放大後可按住滑鼠拖曳；觸控可直接滑動，鍵盤聚焦圖表區後可使用方向鍵。</p>
                <div id="wgl-a12-overview-viewport" class="wgl-zoom-viewport" tabindex="0" aria-label="可縮放與拖曳的 A1-2 Overview" aria-describedby="wgl-a12-overview-help">
                  <pre class="mermaid wgl-mermaid wgl-a12-diagram wgl-zoom-canvas" data-diagram="a1-2-overview">
      flowchart TB
        N01["A12-ENTRY-01<br/>[L1 入口 context；非版本狀態]<br/>尚未建立接替版"] -->|A12-A03| N02["A12-N02<br/>[L1→L2 共同邊界]<br/>接替版 Draft（草稿）"]
        N02 -->|A12-A05A| N03["A12-N03<br/>[L2，視版本而定]<br/>Prepared（已準備、等待啟用）"]
        N03 -->|A12-A07| N04["A12-N04<br/>[L3 共同邊界]<br/>Active（目前生效）／0 個未完成研究"]
        N02 -.->|A12-A05B · bootstrap 例外| N04
        N04 -->|A12-A08| N05["A12-N05<br/>[L3]<br/>Active（目前生效）／1..n 個未完成研究"]
        N05 -->|A12-A10| N04
        N05 -->|A12-A12| N06["A12-N06<br/>[L3；v009 capability]<br/>前一版的安全檢查進行中"]
        N06 -->|A12-A13| N04
        N06 -->|A12-A13| N05
        N04 -.->|A12-A11 · HANDOFF ONLY| N01
        N05 -.->|A12-A11 · HANDOFF ONLY| N01
        N02 -.->|A12-A12| N06
        N06 -.->|A12-A13| N02
                  </pre>
                </div>
                <div class="wgl-render-status text-small" data-mermaid-status="a1-2-overview" aria-live="polite">正在整理 A1-2 Overview…</div>
              </div>
            </section>

            <section class="wgl-a12-segment" aria-labelledby="wgl-a12a-title">
              <h3 id="wgl-a12a-title">A1-2A｜L1 從入口建立正式版本身分</h3>
              <span class="wgl-shared-boundary text-small">N02 共同邊界：A 與 B 顯示的是同一個接替版 Draft</span>
              <ul class="wgl-fsm-notation text-small" aria-label="A1-2A 說明">
                <li>ENTRY-01 只代表「準備建立接替版」的入口 context；此時還沒有正式版本路徑，也還沒有可查詢的版本狀態。</li>
                <li>A12-A03 配發路徑並註冊 Draft 後，流程才開始判斷 N02 這個單一明確版本。</li>
              </ul>
              <div class="wgl-zoom-panel" data-zoom-pan data-zoom-label="A1-2A">
                <div class="wgl-zoom-controls" role="group" aria-label="A1-2A 圖表縮放控制">
                  <span class="wgl-zoom-controls-label text-small">圖表縮放</span>
                  <button class="btn wgl-zoom-out" type="button" aria-controls="wgl-a12a-viewport" aria-label="縮小 A1-2A 圖表" title="縮小">−</button>
                  <button class="btn wgl-zoom-reset" type="button" aria-controls="wgl-a12a-viewport" aria-label="重設 A1-2A 圖表縮放" title="重設為 100%">100%</button>
                  <button class="btn wgl-zoom-in" type="button" aria-controls="wgl-a12a-viewport" aria-label="放大 A1-2A 圖表" title="放大">+</button>
                  <span class="wgl-zoom-announcement sr-only" aria-live="polite">A1-2A 圖表縮放 100%</span>
                </div>
                <p id="wgl-a12a-help" class="wgl-fsm-notation text-small">放大後可按住滑鼠拖曳；觸控可直接滑動，鍵盤聚焦圖表區後可使用方向鍵。</p>
                <div id="wgl-a12a-viewport" class="wgl-zoom-viewport" tabindex="0" aria-label="可縮放與拖曳的 A1-2A" aria-describedby="wgl-a12a-help">
                  <pre class="mermaid wgl-mermaid wgl-a12-diagram wgl-zoom-canvas" data-diagram="a1-2a-identity-formation">
      flowchart LR
        ENTRY(("入口")) -->|A12-A01| N01["A12-ENTRY-01<br/>入口 context；非版本狀態<br/>尚無正式版本路徑"]
        N01 -->|A12-A02| N01
        N01 -->|A12-A03| N02["A12-N02<br/>接替版 Draft（草稿）<br/>共同邊界"]
                  </pre>
                </div>
                <div class="wgl-render-status text-small" data-mermaid-status="a1-2a-identity-formation" aria-live="polite">正在整理 A1-2A…</div>
              </div>
            </section>

            <section class="wgl-a12-segment" aria-labelledby="wgl-a12b-title">
              <h3 id="wgl-a12b-title">A1-2B｜L2 接替版的發布與啟用</h3>
              <span class="wgl-shared-boundary text-small">N02／N04 共同邊界：A、B、C 重複顯示的是同一個版本</span>
              <ul class="wgl-fsm-notation text-small" aria-label="A1-2B 說明">
                <li>只有需要明確啟用的版本才會進入 N03；判定規則是 <code>exact version &gt;= family.activation_required_from</code>。</li>
                <li>A12-A05A 是一般路徑；A12-A05B 只供同一流程系列設定明確允許的舊版 bootstrap 例外。</li>
                <li>A12-A07 必須找到與本次發布相符的 <code>ACTIVATION.json</code>，才能讓接替版成為 Active。</li>
                <li>A12-A12／A13 只會暫時改去處理前一版的安全問題，之後回到原本同一個 N02；接替版仍保持 Draft。</li>
              </ul>
              <div class="wgl-zoom-panel" data-zoom-pan data-zoom-label="A1-2B">
                <div class="wgl-zoom-controls" role="group" aria-label="A1-2B 圖表縮放控制">
                  <span class="wgl-zoom-controls-label text-small">圖表縮放</span>
                  <button class="btn wgl-zoom-out" type="button" aria-controls="wgl-a12b-viewport" aria-label="縮小 A1-2B 圖表" title="縮小">−</button>
                  <button class="btn wgl-zoom-reset" type="button" aria-controls="wgl-a12b-viewport" aria-label="重設 A1-2B 圖表縮放" title="重設為 100%">100%</button>
                  <button class="btn wgl-zoom-in" type="button" aria-controls="wgl-a12b-viewport" aria-label="放大 A1-2B 圖表" title="放大">+</button>
                  <span class="wgl-zoom-announcement sr-only" aria-live="polite">A1-2B 圖表縮放 100%</span>
                </div>
                <p id="wgl-a12b-help" class="wgl-fsm-notation text-small">放大後可按住滑鼠拖曳；觸控可直接滑動，鍵盤聚焦圖表區後可使用方向鍵。</p>
                <div id="wgl-a12b-viewport" class="wgl-zoom-viewport" tabindex="0" aria-label="可縮放與拖曳的 A1-2B" aria-describedby="wgl-a12b-help">
                  <pre class="mermaid wgl-mermaid wgl-a12-diagram wgl-zoom-canvas" data-diagram="a1-2b-release-activation">
      flowchart LR
        N02["A12-N02<br/>接替版 Draft（草稿）<br/>共同邊界"] -->|A12-A04| N02
        N02 -->|A12-A05A| N03["A12-N03<br/>Prepared（已準備、等待啟用）<br/>視版本而定"]
        N03 -->|A12-A06| N03
