:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {

  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {

  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {

}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;

  border: 1px solid var(--input);

}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);

  color: var(--muted-foreground);
  background: transparent;

  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);

  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);

  background: var(--secondary);
  cursor: inherit;
  font: inherit;

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {

  min-height: 72px;
  padding: 8px 10px;

.form-control:focus-visible {

  background-color: var(--secondary);

.form-select:not(:disabled):hover {

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);

  border: 1px solid var(--input);
  color: var(--primary-foreground);

  transition:

}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;workflow-governance-layers&quot;&gt;
  &lt;style&gt;
    #workflow-governance-layers {

    #workflow-governance-layers .wgl-a12-diagram .wgl-a12-layer-l2 &gt; rect,
    #workflow-governance-layers .wgl-a12-diagram .wgl-a12-layer-l2 &gt; circle,
    #workflow-governance-layers .wgl-a12-diagram .wgl-a12-layer-l2 &gt; ellipse,
    #workflow-governance-layers .wgl-a12-diagram .wgl-a12-layer-l2 &gt; polygon,
    #workflow-governance-layers .wgl-a12-diagram .wgl-a12-layer-l2 &gt; path {

      stroke: var(--viz-series-3) !important;

    #workflow-governance-layers .wgl-a12-diagram .wgl-a12-layer-l3 &gt; rect,
    #workflow-governance-layers .wgl-a12-diagram .wgl-a12-layer-l3 &gt; circle,
    #workflow-governance-layers .wgl-a12-diagram .wgl-a12-layer-l3 &gt; ellipse,
    #workflow-governance-layers .wgl-a12-diagram .wgl-a12-layer-l3 &gt; polygon,
    #workflow-governance-layers .wgl-a12-diagram .wgl-a12-layer-l3 &gt; path {
      fill: var(--card) !important;
      stroke: var(--viz-series-2) !important;
      stroke-width: 2px !important;
    }

    #workflow-governance-layers .wgl-a12-diagram .wgl-a12-shared-boundary &gt; rect,
    #workflow-governance-layers .wgl-a12-diagram .wgl-a12-shared-boundary &gt; circle,
    #workflow-governance-layers .wgl-a12-diagram .wgl-a12-shared-boundary &gt; ellipse,
    #workflow-governance-layers .wgl-a12-diagram .wgl-a12-shared-boundary &gt; polygon,
    #workflow-governance-layers .wgl-a12-diagram .wgl-a12-shared-boundary &gt; path {
      stroke-width: 4px !important;
      stroke-dasharray: 6 3 !important;
    }

    #workflow-governance-layers .wgl-a12-diagram .wgl-a12-conditional &gt; rect,
    #workflow-governance-layers .wgl-a12-diagram .wgl-a12-conditional &gt; circle,
    #workflow-governance-layers .wgl-a12-diagram .wgl-a12-conditional &gt; ellipse,
    #workflow-governance-layers .wgl-a12-diagram .wgl-a12-conditional &gt; polygon,
    #workflow-governance-layers .wgl-a12-diagram .wgl-a12-conditional &gt; path {

    #workflow-governance-layers .wgl-a12-diagram .wgl-a12-boundary-port &gt; rect,

    #workflow-governance-layers .wgl-a12-diagram .wgl-a12-boundary-port &gt; ellipse,
    #workflow-governance-layers .wgl-a12-diagram .wgl-a12-boundary-port &gt; polygon,
    #workflow-governance-layers .wgl-a12-diagram .wgl-a12-boundary-port &gt; path {

    #workflow-governance-layers .wgl-cluster-l2 &gt; rect {

    #workflow-governance-layers .wgl-a1-layout,
    #workflow-governance-layers .wgl-a1-figure,
    #workflow-governance-layers .wgl-a1-explorer,
    #workflow-governance-layers .wgl-a1-detail-grid {

      gap: 10px;
      min-width: 0;

    #workflow-governance-layers .wgl-a1-detail-grid {
      grid-template-columns: 1fr;
      margin: 0;

    #workflow-governance-layers .wgl-a1-detail-grid div {

      gap: 3px;
      min-width: 0;

    #workflow-governance-layers .wgl-a1-detail-grid dt {
      color: var(--muted-foreground);

    #workflow-governance-layers .wgl-a1-detail-grid dd {
      margin: 0;

    @media (max-width: 520px) {

    @media (min-width: 900px) {

        gap: 18px;

        align-content: start;
        position: sticky;
        top: 10px;

  &lt;header class=&quot;wgl-header&quot;&gt;
    &lt;h1&gt;Workflow 治理層級&lt;/h1&gt;
  &lt;/header&gt;

  &lt;section class=&quot;wgl-diagram&quot; aria-labelledby=&quot;wgl-switch-title&quot;&gt;
    &lt;h2 id=&quot;wgl-switch-title&quot;&gt;A1｜Workflow 新舊版本如何接替&lt;/h2&gt;
    &lt;ul class=&quot;wgl-fsm-notation text-small&quot; aria-label=&quot;A1 閱讀重點&quot;&gt;
      &lt;li&gt;&lt;strong&gt;前一版（predecessor）：&lt;/strong&gt;目前是 Active（目前生效），之後可能被接替的版本。&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;接替版（successor）：&lt;/strong&gt;準備接替前一版的新版本，可以是 Draft（草稿）或 Prepared（已準備、等待啟用）。&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;同一流程系列（workflow family）：&lt;/strong&gt;同一套 Workflow 的所有版本，例如 v008 與 v009。A1-2 不會把整個系列合成一個狀態。&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;判定單位：&lt;/strong&gt;每一個單一明確版本（exact version）都要分開判斷，而且只能符合一個 A1-2 狀態。&lt;/li&gt;

          &lt;tr&gt;&lt;td&gt;N02&lt;/td&gt;&lt;td&gt;L1→L2 共同邊界&lt;/td&gt;&lt;td&gt;接替版 Draft&lt;/td&gt;&lt;td&gt;&lt;code&gt;status=draft&lt;/code&gt;，而且沒有 &lt;code&gt;RELEASE.json&lt;/code&gt;。&lt;/td&gt;&lt;td&gt;L1 負責建立／修正，L2 負責發布檢查；同一版本不能同時是 N03–N06。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;N03&lt;/td&gt;&lt;td&gt;L2&lt;/td&gt;&lt;td&gt;接替版 Prepared&lt;/td&gt;&lt;td&gt;版本需要明確啟用，&lt;code&gt;status=prepared&lt;/code&gt;，已有有效發布資料，但還沒有相符的啟用資料。&lt;/td&gt;&lt;td&gt;可與 Active 前一版並存；但同一流程系列的限制會阻止新的結果相關研究工作。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;N04&lt;/td&gt;&lt;td&gt;L3&lt;/td&gt;&lt;td&gt;Active 版本&lt;/td&gt;&lt;td&gt;註冊表與發布資料有效；需要明確啟用的版本另須相符的 &lt;code&gt;ACTIVATION.json&lt;/code&gt;；未完成研究數為 0；另須持久化資料證明沒有進行中的安全評估。&lt;/td&gt;&lt;td&gt;同一版本不能同時是 N05／N06；接替版是另一個版本。目前仍缺安全評估開啟／關閉的持久化資料。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;N05&lt;/td&gt;&lt;td&gt;L3&lt;/td&gt;&lt;td&gt;Active 版本&lt;/td&gt;&lt;td&gt;註冊表、發布與適用的啟用資料有效；未完成研究數至少為 1；另須持久化資料證明沒有進行中的安全評估。&lt;/td&gt;&lt;td&gt;Paused 仍算未完成。缺少安全評估資料時，不能只看研究數就排除 N06。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;N06&lt;/td&gt;&lt;td&gt;L3&lt;/td&gt;&lt;td&gt;Active 前一版&lt;/td&gt;&lt;td&gt;註冊表、發布與適用的啟用資料有效，而且有持久化資料證明安全評估仍在進行；原因可包含不安全研究、暫停研究的影響決定不完整，或尚未正式關閉。&lt;/td&gt;&lt;td&gt;進行中的安全評估優先於未完成研究數。目前缺這份持久化資料；需要區分 N04／N05／N06 時應回 invalid（資料矛盾）／indeterminate（資料不足）。&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;wgl-diagram&quot; aria-labelledby=&quot;wgl-study-state-machine-title&quot;&gt;
    &lt;h2 id=&quot;wgl-study-state-machine-title&quot;&gt;A1-3｜每一個 Sxxx 研究實例自己的生命週期&lt;/h2&gt;
    &lt;ul class=&quot;wgl-fsm-notation text-small&quot; aria-label=&quot;A1-3 閱讀重點&quot;&gt;
      &lt;li&gt;&lt;strong&gt;判定單位：&lt;/strong&gt;一次只判斷一個 Sxxx 研究實例，不判斷整個 Workflow 版本。&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;可以有多個：&lt;/strong&gt;同一個 Active Workflow 版本可以有零到多個彼此獨立的 Sxxx。&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;不可混用：&lt;/strong&gt;每個 Sxxx 都走自己的生命週期；不得與 A1-2 的版本狀態，或另一個版本的 Sxxx 混在一起。&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class=&quot;wgl-fsm-notation text-small&quot;&gt;
      &lt;strong&gt;動作資格檢查（G-FAMILY）&lt;/strong&gt;
      &lt;ul&gt;
        &lt;li&gt;G-FAMILY 只判斷「現在能不能執行某個動作」，不是新的 Sxxx 狀態。&lt;/li&gt;
        &lt;li&gt;建立、預先登記、開始、恢復、凍結候選，以及其他會影響結果的動作，都要求研究綁定的版本目前有效且 Active、同一流程系列沒有 Prepared 接替版，而且該版本沒有進行中的安全評估。&lt;/li&gt;
        &lt;li&gt;建立研究另需建立 Draft 的權限；預先登記需完整計畫（plan）並在當次轉換凍結；開始、恢復與凍結候選另需有效的凍結計畫及各階段人工核准。&lt;/li&gt;
        &lt;li&gt;Prepared 限制不阻止暫停、取消、審查者退回或完成審查；但審查者退回後，G-FAMILY 再次成立前不得執行結果相關工作。&lt;/li&gt;
        &lt;li&gt;Paused 仍算未完成；只有 Completed 與 Cancelled 不算未完成。&lt;/li&gt;
        &lt;li&gt;目前實作會對所有進入 Running 的轉換套用有效版本檢查，因此「只做行政退回」的例外仍是後續實作缺口。&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
    &lt;pre class=&quot;mermaid wgl-mermaid wgl-mermaid-a13&quot; data-diagram=&quot;a1-study-state-machine&quot;&gt;
stateDiagram-v2
  direction TB

  state &quot;Draft（草稿）&quot; as StudyDraft
  state &quot;Preregistered（已預先登記）&quot; as StudyPreregistered
  state &quot;Running（進行中）&quot; as StudyRunning
  state &quot;Paused（已暫停）&quot; as StudyPaused
  state &quot;Awaiting review（等待審查）&quot; as AwaitingReview
  state &quot;Completed（已完成）&quot; as StudyCompleted
  state &quot;Cancelled（已取消）&quot; as StudyCancelled

  [*] --&gt; StudyDraft: G-FAMILY + 建立權限 / CLI 配發 Sxxx
  StudyDraft --&gt; StudyPreregistered: G-FAMILY + 完整計畫 + 人工核准 / 凍結指定版本與檔案
  StudyDraft --&gt; StudyCancelled: 記錄原因
  StudyPreregistered --&gt; StudyRunning: G-FAMILY + 凍結計畫有效 + Development 核准
  StudyPreregistered --&gt; StudyCancelled: 記錄原因
  StudyRunning --&gt; StudyPaused: 記錄原因
  StudyPaused --&gt; StudyRunning: G-FAMILY + 凍結計畫有效 + 恢復核准
  StudyRunning --&gt; AwaitingReview: 提交可核對的完整證據
  StudyRunning --&gt; StudyCancelled: 記錄原因
  StudyPaused --&gt; StudyCancelled: 記錄原因
  AwaitingReview --&gt; StudyRunning: 審查者只做行政退回並記錄原因；後續執行仍受 G-FAMILY 限制
  AwaitingReview --&gt; StudyCompleted: 審查者確認 / 凍結研究結果
  StudyCompleted --&gt; [*]
  StudyCancelled --&gt; [*]

  note right of StudyRunning
    凍結候選與其他會影響結果的動作：
    必須通過 G-FAMILY、凍結計畫檢查與該階段人工核准。
    一個階段的核准不能代替另一個階段。
  end note

  classDef l3 fill:var(--card),stroke:var(--viz-series-2),stroke-width:2px,color:var(--foreground)
  class StudyDraft,StudyPreregistered,StudyRunning,StudyPaused,AwaitingReview,StudyCompleted,StudyCancelled l3
    &lt;/pre&gt;

    const createZoomPanController = (panel) =&gt; {
      const diagram = panel.querySelector(&quot;.wgl-zoom-canvas&quot;);
      const viewport = panel.querySelector(&quot;.wgl-zoom-viewport&quot;);
      const controls = panel.querySelector(&quot;.wgl-zoom-controls&quot;);
      const help = panel.querySelector(&quot;.wgl-fsm-notation&quot;);
      const zoomOut = panel.querySelector(&quot;.wgl-zoom-out&quot;);
      const zoomReset = panel.querySelector(&quot;.wgl-zoom-reset&quot;);
      const zoomIn = panel.querySelector(&quot;.wgl-zoom-in&quot;);
      const announcement = panel.querySelector(&quot;.wgl-zoom-announcement&quot;);
      const label = panel.dataset.zoomLabel || &quot;圖表&quot;;
      const zoomMin = 75;
      const zoomMax = 200;
      const zoomStep = 25;
      let zoom = 100;
      let panPointerId = null;
      let panStartX = 0;
      let panStartY = 0;
      let panStartScrollLeft = 0;
      let panStartScrollTop = 0;

      controls.hidden = !a12ZoomControlsEnabled;
      if (!a12ZoomControlsEnabled) {
        help.textContent = &quot;圖表維持 100%；縮放控制目前隱藏。&quot;;
      }

      const refresh = () =&gt; {
        const isPannable =
          viewport.scrollWidth &gt; viewport.clientWidth + 1 ||
          viewport.scrollHeight &gt; viewport.clientHeight + 1;
        viewport.classList.toggle(&quot;is-pannable&quot;, isPannable);
      };

      const applyZoom = (nextZoom) =&gt; {
        const previousScrollableWidth = viewport.scrollWidth;
        const previousScrollableHeight = viewport.scrollHeight;
        const previousCenter = viewport.scrollLeft + viewport.clientWidth / 2;
        const previousMiddle = viewport.scrollTop + viewport.clientHeight / 2;
        const previousCenterRatio = previousScrollableWidth
          ? previousCenter / previousScrollableWidth
          : 0.5;
        const previousMiddleRatio = previousScrollableHeight
          ? previousMiddle / previousScrollableHeight
          : 0.5;
        zoom = Math.min(zoomMax, Math.max(zoomMin, nextZoom));
        diagram.style.width = `${zoom}%`;
        viewport.classList.toggle(&quot;is-zoomed&quot;, zoom &gt; 100);
        zoomReset.textContent = `${zoom}%`;
        zoomReset.title = zoom === 100 ? &quot;目前為 100%&quot; : &quot;重設為 100%&quot;;
        zoomOut.disabled = zoom === zoomMin;
        zoomIn.disabled = zoom === zoomMax;
        announcement.textContent = `${label} 圖表縮放 ${zoom}%`;
        requestAnimationFrame(() =&gt; {
          const nextCenter = previousCenterRatio * viewport.scrollWidth;
          const nextMiddle = previousMiddleRatio * viewport.scrollHeight;
          viewport.scrollLeft = Math.max(0, nextCenter - viewport.clientWidth / 2);
          viewport.scrollTop = Math.max(0, nextMiddle - viewport.clientHeight / 2);
          refresh();
        });
      };

      const stopPan = () =&gt; {
        if (panPointerId === null) return;
        if (viewport.hasPointerCapture(panPointerId)) {
          viewport.releasePointerCapture(panPointerId);
        }
        panPointerId = null;
        viewport.classList.remove(&quot;is-panning&quot;);
      };

      viewport.addEventListener(&quot;pointerdown&quot;, (event) =&gt; {
        if (event.pointerType === &quot;touch&quot; || event.button !== 0) return;
        if (!viewport.classList.contains(&quot;is-pannable&quot;)) return;
        panPointerId = event.pointerId;
        panStartX = event.clientX;
        panStartY = event.clientY;
        panStartScrollLeft = viewport.scrollLeft;
        panStartScrollTop = viewport.scrollTop;
        viewport.setPointerCapture(event.pointerId);
        viewport.classList.add(&quot;is-panning&quot;);
      });

      viewport.addEventListener(&quot;pointermove&quot;, (event) =&gt; {
        if (event.pointerId !== panPointerId) return;
        event.preventDefault();
        viewport.scrollLeft = panStartScrollLeft - (event.clientX - panStartX);
        viewport.scrollTop = panStartScrollTop - (event.clientY - panStartY);
      });
      viewport.addEventListener(&quot;pointerup&quot;, stopPan);
      viewport.addEventListener(&quot;pointercancel&quot;, stopPan);
      viewport.addEventListener(&quot;lostpointercapture&quot;, () =&gt; {
        panPointerId = null;
        viewport.classList.remove(&quot;is-panning&quot;);
      });
      zoomOut.addEventListener(&quot;click&quot;, () =&gt; applyZoom(zoom - zoomStep));
      zoomReset.addEventListener(&quot;click&quot;, () =&gt; applyZoom(100));
      zoomIn.addEventListener(&quot;click&quot;, () =&gt; applyZoom(zoom + zoomStep));
      applyZoom(100);
      return { refresh };
    };

      a12Statuses.forEach((status, diagram) =&gt; {

&lt;script&gt;
(() =&gt; {

  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

  const getTooltip = () =&gt; {
    if (tooltip == null) {
