:root[data-theme=&quot;light&quot;] {
  color-scheme: light;

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {

  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {

}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;

}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);

  background: var(--secondary);

  font: inherit;

  height: 28px;
  padding: 3px;

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {

  corner-shape: superellipse(1.5);

  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);

.form-control:disabled,
.form-select:disabled {

  opacity: 0.4;

.form-select {

  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:

.form-select:not(:disabled):hover {

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);

.form-check {

  align-items: center;
  gap: 6px;

  border: 1px solid var(--input);
  color: var(--primary-foreground);

  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {

  display: block;

  padding: 0;

.form-range::-webkit-slider-runnable-track {
  height: 28px;

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);

}

.form-range::-moz-range-track {

.form-range::-moz-range-thumb {

  height: 20px;

.form-range:focus-visible::-moz-range-thumb {

.form-range:disabled {

      &lt;div class=&quot;wf-col&quot;&gt;
        &lt;div class=&quot;wf-col-label&quot;&gt;Data &amp; dependencies&lt;/div&gt;
        &lt;div class=&quot;wf-box wf-store&quot;&gt;&lt;strong&gt;workflows/&lt;/strong&gt;&lt;small&gt;root registry、WORKFLOW.md、RELEASE.json、changes、studies&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;wf-box wf-store&quot;&gt;&lt;strong&gt;state/workflow-authoring/&lt;/strong&gt;&lt;small&gt;local-only WAL、staging、abort envelope&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;wf-box wf-store&quot;&gt;&lt;strong&gt;Policy + qualification registries&lt;/strong&gt;&lt;small&gt;四種 exact policy pins；study qualification WAL&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;wf-box wf-store&quot;&gt;&lt;strong&gt;Git canonical authority&lt;/strong&gt;&lt;small&gt;current HEAD、origin/HEAD tracking tip、history anchors&lt;/small&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;wf-flow-note&quot; aria-label=&quot;共同 mutation gate&quot;&gt;
      &lt;div class=&quot;wf-gate&quot;&gt;1. Shared lock&lt;/div&gt;
      &lt;div class=&quot;wf-gate&quot;&gt;2. Recover WALs&lt;/div&gt;
      &lt;div class=&quot;wf-gate&quot;&gt;3. Re-read state&lt;/div&gt;
      &lt;div class=&quot;wf-gate&quot;&gt;4. Stage + validate&lt;/div&gt;
      &lt;div class=&quot;wf-gate&quot;&gt;5. CAS + publish&lt;/div&gt;
      &lt;div class=&quot;wf-gate&quot;&gt;6. Git effective proof&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;wf-foot&quot;&gt;
      &lt;span class=&quot;wf-key&quot;&gt;&lt;i class=&quot;wf-dot human&quot;&gt;&lt;/i&gt;Human authority&lt;/span&gt;
      &lt;span class=&quot;wf-key&quot;&gt;&lt;i class=&quot;wf-dot&quot;&gt;&lt;/i&gt;System boundary&lt;/span&gt;
      &lt;span class=&quot;wf-key&quot;&gt;&lt;i class=&quot;wf-dot authority&quot;&gt;&lt;/i&gt;Canonical data/authority&lt;/span&gt;
      &lt;span class=&quot;wf-key&quot;&gt;&lt;i class=&quot;wf-dot block&quot;&gt;&lt;/i&gt;Fail closed&lt;/span&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;wf-panel&quot; data-panel=&quot;create&quot; aria-label=&quot;新增 workflow 流程圖&quot;&gt;
    &lt;div class=&quot;wf-panel-title&quot;&gt;&lt;strong&gt;新增 workflow family&lt;/strong&gt;&lt;span&gt;成功輸出是 validated v001 draft；release 另行核准&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;wf-sequence&quot;&gt;
      &lt;div class=&quot;wf-steps&quot;&gt;
        &lt;div class=&quot;wf-step&quot;&gt;&lt;b&gt;1&lt;/b&gt;&lt;strong&gt;理解來源&lt;/strong&gt;&lt;small&gt;抽取 explicit / missing / conflict；來源預設保留&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;wf-step human&quot;&gt;&lt;b&gt;2&lt;/b&gt;&lt;strong&gt;確認決策&lt;/strong&gt;&lt;small&gt;slug、authority、research-validity、四種 policy&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;wf-step&quot;&gt;&lt;b&gt;3&lt;/b&gt;&lt;strong&gt;配置 v001&lt;/strong&gt;&lt;small&gt;掃 registry、paths、index、untracked、reachable refs；collision fail closed&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;wf-step&quot;&gt;&lt;b&gt;4&lt;/b&gt;&lt;strong&gt;原子建 draft&lt;/strong&gt;&lt;small&gt;WORKFLOW.md、README metadata、registry entry、indexes 同一 transaction&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;wf-step&quot;&gt;&lt;b&gt;5&lt;/b&gt;&lt;strong&gt;Validate&lt;/strong&gt;&lt;small&gt;closed schema、capability、policy kinds、placeholder、history&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;wf-step human&quot;&gt;&lt;b&gt;6&lt;/b&gt;&lt;strong&gt;Release approval&lt;/strong&gt;&lt;small&gt;human identity；完整 evidence 與 exact pins&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;wf-step git&quot;&gt;&lt;b&gt;7&lt;/b&gt;&lt;strong&gt;Canonical merge&lt;/strong&gt;&lt;small&gt;prepared bytes 進 canonical tip 後，才成為 effective authority&lt;/small&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;wf-lanes&quot;&gt;
        &lt;div class=&quot;wf-lane-label&quot;&gt;不再手動&lt;/div&gt;&lt;div class=&quot;wf-lane-body&quot;&gt;配置 v001 · 複製 template · 替換 REPLACE_ME · 編輯 root registry · 執行 sync · 清理 partial state&lt;/div&gt;
        &lt;div class=&quot;wf-lane-label&quot;&gt;硬性邊界&lt;/div&gt;&lt;div class=&quot;wf-lane-body&quot;&gt;新 family 永遠從 v001 開始；每種 policy kind 恰好一個；unknown capability / retired selection / 不完整 history proof 一律拒絕&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;wf-panel&quot; data-panel=&quot;change&quot; aria-label=&quot;修改 active workflow 流程圖&quot;&gt;
    &lt;div class=&quot;wf-panel-title&quot;&gt;&lt;strong&gt;修改 active workflow&lt;/strong&gt;&lt;span&gt;released bytes 不改寫；所有實質修改由 accepted change 追溯&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;wf-sequence&quot;&gt;
      &lt;div class=&quot;wf-steps&quot;&gt;
        &lt;div class=&quot;wf-step&quot;&gt;&lt;b&gt;1&lt;/b&gt;&lt;strong&gt;分析 impact&lt;/strong&gt;&lt;small&gt;active contract、studies、policies、inbound references&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;wf-step&quot;&gt;&lt;b&gt;2&lt;/b&gt;&lt;strong&gt;建立 CHANGE.md&lt;/strong&gt;&lt;small&gt;單一 author-edited authority；配置永不重用的 Cxxx&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;wf-step human&quot;&gt;&lt;b&gt;3&lt;/b&gt;&lt;strong&gt;Human decision&lt;/strong&gt;&lt;small&gt;accepted / rejected / deferred / withdrawn；產生 content-addressed event&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;wf-step git&quot;&gt;&lt;b&gt;4&lt;/b&gt;&lt;strong&gt;Anchor decision&lt;/strong&gt;&lt;small&gt;event + matching CHANGE.md 必須先進 current HEAD 才能授權 follow-up&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;wf-step&quot;&gt;&lt;b&gt;5&lt;/b&gt;&lt;strong&gt;Evolve draft&lt;/strong&gt;&lt;small&gt;聚合 accepted changes；建立或更新唯一 next-version draft&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;wf-step&quot;&gt;&lt;b&gt;6&lt;/b&gt;&lt;strong&gt;Safe boundary&lt;/strong&gt;&lt;small&gt;unfinished studies 先 paused/completed/cancelled；paused 有 typed disposition&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;wf-step git&quot;&gt;&lt;b&gt;7&lt;/b&gt;&lt;strong&gt;Release → merge&lt;/strong&gt;&lt;small&gt;schema-v2 pins change authority、basis、dependencies；canonical merge 才有效&lt;/small&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;wf-lanes&quot;&gt;
        &lt;div class=&quot;wf-lane-label&quot;&gt;Legacy compatibility&lt;/div&gt;&lt;div class=&quot;wf-lane-body&quot;&gt;既有 README + PROPOSAL + IMPACT + VALIDATION + DECISION 永久可讀；同一 change directory 禁止 mixed representation&lt;/div&gt;
        &lt;div class=&quot;wf-lane-label&quot;&gt;Cross-version study&lt;/div&gt;&lt;div class=&quot;wf-lane-body&quot;&gt;continue / restart 只可消耗 paused source 且 single-use；close-invalidated 不可消耗；legacy edge 只能由固定 cutover manifest grandfather&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;wf-panel&quot; data-panel=&quot;stop&quot; aria-label=&quot;停止使用 workflow 決策圖&quot;&gt;
    &lt;div class=&quot;wf-panel-title&quot;&gt;&lt;strong&gt;停止使用 / 刪除語意&lt;/strong&gt;&lt;span&gt;registered history 永不實體刪除&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;wf-tree&quot;&gt;
      &lt;div class=&quot;wf-tree-root&quot;&gt;使用者說「停止／刪除 workflow」&lt;/div&gt;
      &lt;div class=&quot;wf-branches&quot;&gt;
        &lt;div class=&quot;wf-branch&quot;&gt;&lt;h3&gt;Unregistered local draft&lt;/h3&gt;&lt;div&gt;回報 exact path 與 Git status；不自動刪除、不建立隱性 tombstone。&lt;span class=&quot;wf-result&quot;&gt;結果：保持 byte-identical&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;wf-branch&quot;&gt;&lt;h3&gt;Registered draft&lt;/h3&gt;&lt;div&gt;走 guarded abandon；registry entry 永久保留，版本號永不重用。&lt;span class=&quot;wf-result&quot;&gt;結果：abandoned&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;wf-branch&quot;&gt;&lt;h3&gt;Active workflow&lt;/h3&gt;&lt;div&gt;human approval + reason + safe-study check；paused study 只能 close-invalidated；產生 retirement evidence。&lt;span class=&quot;wf-result&quot;&gt;結果：retired（terminal）&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;wf-branch&quot;&gt;&lt;h3&gt;Released terminal history&lt;/h3&gt;&lt;div&gt;superseded / retired / abandoned history、release evidence、studies 一律永久保留。&lt;span class=&quot;wf-result danger&quot;&gt;結果：拒絕實體刪除&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;wf-foot&quot;&gt;&lt;span&gt;Root registry schema 2：retired entry 必須 pin retirement-evidence digest；migration marker 與 after-registry bytes 先進 HEAD，才允許下一次 registry mutation。&lt;/span&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;wf-panel&quot; data-panel=&quot;recovery&quot; aria-label=&quot;Crash recovery 狀態圖&quot;&gt;
    &lt;div class=&quot;wf-panel-title&quot;&gt;&lt;strong&gt;Shared lock 與雙 WAL 復原&lt;/strong&gt;&lt;span&gt;任何 eligibility-changing writer 都先完成 recovery，再重讀 lifecycle&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;wf-state-wrap&quot;&gt;
      &lt;div class=&quot;wf-state-grid&quot;&gt;
        &lt;div class=&quot;wf-state-block&quot;&gt;
          &lt;h3&gt;Authoring transaction WAL&lt;/h3&gt;
          &lt;div class=&quot;wf-state-line&quot;&gt;
            &lt;span class=&quot;wf-state&quot;&gt;prepared&lt;/span&gt;&lt;span class=&quot;wf-arrow&quot;&gt;→&lt;/span&gt;
            &lt;span class=&quot;wf-state ok&quot;&gt;commit-decided&lt;/span&gt;&lt;span class=&quot;wf-arrow&quot;&gt;→&lt;/span&gt;
            &lt;span class=&quot;wf-state ok&quot;&gt;complete&lt;/span&gt;&lt;span class=&quot;wf-arrow&quot;&gt;→&lt;/span&gt;
            &lt;span class=&quot;wf-state ok&quot;&gt;cleanup&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;wf-state-line&quot; style=&quot;margin-top:10px&quot;&gt;
            &lt;span class=&quot;wf-state&quot;&gt;prepared&lt;/span&gt;&lt;span class=&quot;wf-arrow&quot;&gt;→ mismatch →&lt;/span&gt;
            &lt;span class=&quot;wf-state warn&quot;&gt;prepared-conflicted&lt;/span&gt;&lt;span class=&quot;wf-arrow&quot;&gt;→ audited abort only →&lt;/span&gt;
            &lt;span class=&quot;wf-state bad&quot;&gt;cleanup&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;wf-state-block&quot;&gt;
          &lt;h3&gt;Qualification transaction WAL&lt;/h3&gt;
          &lt;div class=&quot;wf-state-line&quot;&gt;
            &lt;span class=&quot;wf-state ok&quot;&gt;durable journal = commit decision&lt;/span&gt;&lt;span class=&quot;wf-arrow&quot;&gt;→&lt;/span&gt;
            &lt;span class=&quot;wf-state ok&quot;&gt;roll forward registries&lt;/span&gt;&lt;span class=&quot;wf-arrow&quot;&gt;→&lt;/span&gt;
            &lt;span class=&quot;wf-state ok&quot;&gt;cleanup&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;wf-lock-order&quot;&gt;沒有 rollback branch。Pause、cancel、complete、release、retire 或 revisit init 前，必須先找出受影響 registry 並完成 exact roll-forward。&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;wf-lock-order&quot;&gt;&lt;strong&gt;固定 lock ordering：&lt;/strong&gt; workflow repository lock → sorted qualification registration locks → qualification journal lock → trial-registry lock → qualification-registry lock&lt;/div&gt;
      &lt;div class=&quot;wf-lock-order&quot;&gt;&lt;strong&gt;CAS rule：&lt;/strong&gt; commit decision 前重驗所有 targets 與 validation read-set。任何 byte / kind / mode drift 都 fail closed；commit-decided 之後只能 deterministic roll-forward。&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;wf-viz-20260820&#x27;);
      if (!root) return;
      const tabs = Array.from(root.querySelectorAll(&#x27;.wf-tab&#x27;));
      const panels = Array.from(root.querySelectorAll(&#x27;.wf-panel&#x27;));
      tabs.forEach((tab) =&gt; {
        tab.addEventListener(&#x27;click&#x27;, () =&gt; {
          const selected = tab.dataset.view;
          tabs.forEach((item) =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, String(item === tab)));
          panels.forEach((panel) =&gt; panel.classList.toggle(&#x27;is-active&#x27;, panel.dataset.panel === selected));
        });
      });
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
