:root[data-theme=&quot;light&quot;] {
  color-scheme: light;

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {

}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;

  border: 1px solid var(--input);

  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);

}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);

  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);

  background: var(--secondary);
  cursor: inherit;
  font: inherit;

  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {

  corner-shape: superellipse(1.5);

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {

  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),

.form-select:not(:disabled):hover {

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);

.form-check {

  min-height: 20px;
  align-items: center;
  gap: 6px;

.form-check-input {

  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);

  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;

}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);

      color-mix(in srgb, var(--foreground) 7%, transparent),

}

.form-range::-webkit-slider-runnable-track {

}

.form-range::-webkit-slider-thumb {

  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);

.form-range:focus-visible::-webkit-slider-thumb {

.form-range::-moz-range-track {

}

&lt;body&gt;
&lt;div id=&quot;workflow-governance-flow&quot;&gt;
  &lt;style&gt;

  &lt;/style&gt;

  &lt;header class=&quot;wg-header&quot;&gt;
    &lt;h1&gt;Workflow 治理流程&lt;/h1&gt;
    &lt;div class=&quot;wg-legend&quot; aria-label=&quot;治理角色圖例&quot;&gt;
      &lt;span class=&quot;viz-badge&quot;&gt;Authoring：意圖、preview、draft&lt;/span&gt;
      &lt;span class=&quot;viz-badge&quot;&gt;Authority：human decision、release、merge&lt;/span&gt;

    &lt;/div&gt;
    &lt;div id=&quot;wg-render-status&quot; class=&quot;wg-status text-small&quot; aria-live=&quot;polite&quot;&gt;
      正在整理治理圖…
    &lt;/div&gt;
  &lt;/header&gt;

  &lt;section class=&quot;wg-panel&quot; aria-labelledby=&quot;wg-sequence-title&quot;&gt;
    &lt;h2 id=&quot;wg-sequence-title&quot;&gt;Sequence diagram｜權限與交接&lt;/h2&gt;
    &lt;pre class=&quot;mermaid wg-diagram wg-desktop-only&quot; data-diagram=&quot;sequence&quot;&gt;
sequenceDiagram
    autonumber
    actor H as 人類 Author / Owner
    participant A as Authoring façade
    participant R as Repository + Git
    participant O as Study Operator
    participant V as Independent Reviewer

    H-&gt;&gt;A: 提交 closed request + --dry-run
    A-&gt;&gt;R: plan create / change / evolve
    R--&gt;&gt;A: deterministic preview（ID、pins、diff、blockers）
    A--&gt;&gt;H: 顯示 preview；零 mutation

    alt 未確認或需修訂
        H-&gt;&gt;H: 修改 request / source（來源預設保留）
    else 確認 exact preview
        H-&gt;&gt;A: 套用同一 request
        A-&gt;&gt;R: authoring lock + precondition recheck
        R-&gt;&gt;R: stage complete after-tree + validate
        R--&gt;&gt;A: atomic publish draft + indexes
        A--&gt;&gt;H: draft path / allocated identity
    end

    H-&gt;&gt;A: guarded change decision + human identity
    A-&gt;&gt;R: accepted / rejected / deferred / withdrawn
    H-&gt;&gt;A: evolve accepted changes + --dry-run / apply
    A-&gt;&gt;R: 建立 next-version draft；released bytes 不變
    H-&gt;&gt;A: release --approved-by human-id
    A-&gt;&gt;R: 檢查 impact、open work、policy pins
    R--&gt;&gt;H: prepared RELEASE.json；尚未生效
    H-&gt;&gt;R: merge prepared commit to canonical branch
    R--&gt;&gt;O: active version + immutable workflow / policy pins

    O-&gt;&gt;R: init → preregister → run → awaiting-review
    R--&gt;&gt;V: frozen hypothesis、plan、evidence、outcome rules
    V-&gt;&gt;R: independent conclusion + terminal outcome
    R--&gt;&gt;H: pass / fail / insufficient-evidence / indeterminate
    &lt;/pre&gt;
    &lt;ol class=&quot;wg-mobile-only wg-mobile-sequence&quot; aria-label=&quot;手機版權限交接 sequence diagram&quot;&gt;
      &lt;li&gt;&lt;span class=&quot;wg-step-number&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;wg-message&quot;&gt;&lt;strong&gt;Author → Façade&lt;/strong&gt;&lt;span&gt;Closed request，以 &lt;code&gt;--dry-run&lt;/code&gt; 預覽。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;wg-step-number&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;wg-message&quot;&gt;&lt;strong&gt;Façade → Repository&lt;/strong&gt;&lt;span&gt;配置 ID、解析 pins、計算 deterministic diff。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;wg-step-number&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;wg-message&quot;&gt;&lt;strong&gt;Repository → Author&lt;/strong&gt;&lt;span&gt;回傳 preview；worktree 維持零 mutation。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;wg-step-number&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;wg-message&quot;&gt;&lt;strong&gt;Author → Façade&lt;/strong&gt;&lt;span&gt;確認 exact preview 後套用同一 request。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;wg-step-number&quot;&gt;5&lt;/span&gt;&lt;span class=&quot;wg-message&quot;&gt;&lt;strong&gt;Façade → Repository&lt;/strong&gt;&lt;span&gt;Lock、recheck、stage、validate、atomic publish draft。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;wg-step-number&quot;&gt;6&lt;/span&gt;&lt;span class=&quot;wg-message&quot;&gt;&lt;strong&gt;Human Owner → Repository&lt;/strong&gt;&lt;span&gt;記錄 change decision；operator 不自行批准。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;wg-step-number&quot;&gt;7&lt;/span&gt;&lt;span class=&quot;wg-message&quot;&gt;&lt;strong&gt;Author → Repository&lt;/strong&gt;&lt;span&gt;由 accepted changes 演進 next-version draft。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;wg-step-number&quot;&gt;8&lt;/span&gt;&lt;span class=&quot;wg-message&quot;&gt;&lt;strong&gt;Human Owner → Repository&lt;/strong&gt;&lt;span&gt;批准 release preparation；尚未生效。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;wg-step-number&quot;&gt;9&lt;/span&gt;&lt;span class=&quot;wg-message&quot;&gt;&lt;strong&gt;Canonical Git → Study Operator&lt;/strong&gt;&lt;span&gt;Merge 後才成為 active，交付 immutable pins。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;wg-step-number&quot;&gt;10&lt;/span&gt;&lt;span class=&quot;wg-message&quot;&gt;&lt;strong&gt;Operator → Reviewer&lt;/strong&gt;&lt;span&gt;執行 frozen plan，提交 exact evidence。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;wg-step-number&quot;&gt;11&lt;/span&gt;&lt;span class=&quot;wg-message&quot;&gt;&lt;strong&gt;Independent Reviewer → Repository&lt;/strong&gt;&lt;span&gt;依 frozen rules 寫入 conclusion 與 terminal outcome。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/section&gt;

  &lt;section class=&quot;wg-panel&quot; aria-labelledby=&quot;wg-activity-title&quot;&gt;
    &lt;h2 id=&quot;wg-activity-title&quot;&gt;Activity diagram｜生命週期與治理閘門&lt;/h2&gt;
    &lt;pre class=&quot;mermaid wg-diagram wg-desktop-only&quot; data-diagram=&quot;activity&quot;&gt;
flowchart TD
    START([Authoring intent]) --&gt; MODE{新 family 或既有 active family?}
    MODE --&gt;|新 family| CREATE[Closed create request]
    MODE --&gt;|既有 family| CHANGE[建立 Cxxx change → proposed]
    CHANGE --&gt; DECIDE{Human change decision}
    DECIDE --&gt;|rejected / withdrawn| CEND([Change terminal])
    DECIDE --&gt;|deferred| DEFER([修訂後重新 proposed])
    DECIDE --&gt;|accepted| EVOLVE[Closed evolve request]
    CREATE --&gt; PREVIEW[Dry-run：ID + pins + diff + blockers]
    EVOLVE --&gt; PREVIEW
    PREVIEW --&gt; CONFIRM{確認 exact preview?}
    CONFIRM --&gt;|否| REVISE([修訂輸入；source / request 保留])
    CONFIRM --&gt;|是| APPLY[Lock → recheck → stage → validate → publish]
    APPLY --&gt; DRAFT[Registered draft version]
    DRAFT --&gt;|不再採用| ABANDON([abandoned])
    DRAFT --&gt; GATE{Impact / open work 已解決&lt;br/&gt;且 human 批准 release?}
    GATE --&gt;|否| HOLD([維持 draft；先解決 governance blocker])
    GATE --&gt;|是| PREPARE[Prepare RELEASE.json；尚未生效]
    PREPARE --&gt; MERGE{Merged to canonical branch?}
    MERGE --&gt;|否| NOAUTH([Prepared only；無執行權限])
    MERGE --&gt;|是| ACTIVE[active released version]
    ACTIVE --&gt;|retire approval + no blocker| RETIRED([retired])
    ACTIVE --&gt; INIT[init + human preregistration]
    INIT --&gt; RUN[執行 frozen plan + exact evidence]
    RUN --&gt; REVIEWQ[awaiting-review]
    REVIEWQ --&gt; REVIEW[Independent evidence review]
    REVIEW --&gt; OUTCOME([pass / fail / insufficient-evidence / indeterminate])
    &lt;/pre&gt;
    &lt;div class=&quot;wg-mobile-only wg-mobile-flow&quot; role=&quot;img&quot; aria-label=&quot;手機版 workflow activity diagram&quot;&gt;
      &lt;div class=&quot;wg-flow-node&quot;&gt;Authoring intent&lt;/div&gt;

      &lt;div class=&quot;wg-flow-arrow&quot;&gt;↓ exact preview confirmed&lt;/div&gt;
      &lt;div class=&quot;wg-flow-node&quot;&gt;Lock → recheck → stage → validate → publish&lt;/div&gt;

      &lt;div class=&quot;wg-flow-arrow&quot;&gt;↓ canonical merge&lt;/div&gt;
      &lt;div class=&quot;wg-flow-node wg-flow-authority&quot;&gt;Active released version&lt;/div&gt;
      &lt;div class=&quot;wg-flow-arrow&quot;&gt;↓ exact workflow + policy pins&lt;/div&gt;

    &lt;/div&gt;
  &lt;/section&gt;

  &lt;script type=&quot;module&quot;&gt;
    const root = document.getElementById(&quot;workflow-governance-flow&quot;);
    const status = root.querySelector(&quot;#wg-render-status&quot;);
    const diagrams = root.querySelectorAll(&quot;.mermaid&quot;);

    const colorCanvas = document.createElement(&quot;canvas&quot;);
    colorCanvas.width = 1;
    colorCanvas.height = 1;
    const colorContext = colorCanvas.getContext(&quot;2d&quot;, { willReadFrequently: true });

    const normalizeColor = (value) =&gt; {
      colorContext.clearRect(0, 0, 1, 1);
      colorContext.fillStyle = value;
      colorContext.fillRect(0, 0, 1, 1);
      const [red, green, blue, alpha] = colorContext.getImageData(0, 0, 1, 1).data;
      return `rgba(${red}, ${green}, ${blue}, ${alpha / 255})`;
    };

    const readColor = (name) =&gt; {
      const resolver = document.createElement(&quot;span&quot;);
      resolver.style.color = `var(${name})`;
      resolver.hidden = true;
      root.appendChild(resolver);
      const resolved = normalizeColor(getComputedStyle(resolver).color);
      resolver.remove();
      return resolved;
    };

    try {
      const isMobileLayout = window.matchMedia(&quot;(max-width: 520px)&quot;).matches;
      if (!isMobileLayout) {
        const module = await import(&quot;https://cdn.jsdelivr.net/npm/mermaid@11.12.0/+esm&quot;);
        const mermaid = module.default;
        mermaid.initialize({
        startOnLoad: false,
        securityLevel: &quot;strict&quot;,
        theme: &quot;base&quot;,
        themeVariables: {
          background: &quot;transparent&quot;,
          primaryColor: readColor(&quot;--card&quot;),
          primaryTextColor: readColor(&quot;--card-foreground&quot;),
          primaryBorderColor: readColor(&quot;--border&quot;),
          secondaryColor: readColor(&quot;--muted&quot;),
          secondaryTextColor: readColor(&quot;--foreground&quot;),
          secondaryBorderColor: readColor(&quot;--border&quot;),
          tertiaryColor: readColor(&quot;--background&quot;),
          tertiaryTextColor: readColor(&quot;--foreground&quot;),
          tertiaryBorderColor: readColor(&quot;--border&quot;),
          lineColor: readColor(&quot;--muted-foreground&quot;),
          textColor: readColor(&quot;--foreground&quot;),
          actorBkg: readColor(&quot;--card&quot;),
          actorBorder: readColor(&quot;--border&quot;),
          actorTextColor: readColor(&quot;--card-foreground&quot;),
          actorLineColor: readColor(&quot;--border&quot;),
          signalColor: readColor(&quot;--foreground&quot;),
          signalTextColor: readColor(&quot;--foreground&quot;),
          labelBoxBkgColor: readColor(&quot;--muted&quot;),
          labelBoxBorderColor: readColor(&quot;--border&quot;),
          labelTextColor: readColor(&quot;--foreground&quot;),
          loopTextColor: readColor(&quot;--foreground&quot;),
          noteBkgColor: readColor(&quot;--accent&quot;),
          noteBorderColor: readColor(&quot;--border&quot;),
          noteTextColor: readColor(&quot;--accent-foreground&quot;),
          clusterBkg: readColor(&quot;--background&quot;),
          clusterBorder: readColor(&quot;--border&quot;),
          edgeLabelBackground: readColor(&quot;--background&quot;),
          fontSize: &quot;12px&quot;
        },
        flowchart: {
          curve: &quot;basis&quot;,
          htmlLabels: true,
          nodeSpacing: 28,
          rankSpacing: 36,
          padding: 10,
          useMaxWidth: true
        },
        sequence: {
          useMaxWidth: true,
          actorMargin: 28,
          messageMargin: 24,
          diagramMarginX: 8,
          diagramMarginY: 8
        }
        });

        await mermaid.run({ nodes: diagrams });
        root.querySelectorAll(&quot;svg&quot;).forEach((svg) =&gt; {
          svg.setAttribute(&quot;role&quot;, &quot;img&quot;);
          svg.setAttribute(&quot;aria-label&quot;, svg.closest(&quot;section&quot;).querySelector(&quot;h2&quot;).textContent);
          svg.removeAttribute(&quot;height&quot;);
        });
      }
      status.textContent = &quot;治理責任分離：authoring 建立 draft；人類決定與 merge 授權；study operator 執行；independent reviewer 判定 outcome。&quot;;
    } catch (error) {
      console.error(error);
      status.textContent = &quot;治理圖載入失敗；下方保留可讀的 diagram source。&quot;;
      status.classList.add(&quot;text-destructive&quot;);
    }
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;

    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
