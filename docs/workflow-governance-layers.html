:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;

  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);

  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);

  background-color: var(--secondary);

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    #workflow-governance-layers {

    #workflow-governance-layers .wgl-arrow {
      color: var(--muted-foreground);
    }

    #workflow-governance-layers .wgl-diagram {
      display: grid;
      gap: 12px;
      min-width: 0;
    }

    #workflow-governance-layers .wgl-mermaid {
      width: 100%;
      min-width: 0;
      margin: 0;
      overflow: visible;
      color: var(--foreground);
      text-align: center;
      white-space: pre-wrap;
    }

      display: block;

      max-width: 100%;
      height: auto;
      margin: 0 auto;

    #workflow-governance-layers .wgl-render-status {
      color: var(--muted-foreground);
      text-align: center;
    }

    #workflow-governance-layers .wgl-node-link {
      cursor: pointer;
    }

    #workflow-governance-layers .wgl-node-link:focus-visible .node &gt; :first-child {
      stroke: var(--ring);
      stroke-width: 3px;
    }

    #workflow-governance-layers .wgl-a1-layout,
    #workflow-governance-layers .wgl-a1-figure,
    #workflow-governance-layers .wgl-a1-explorer,
    #workflow-governance-layers .wgl-a1-detail-grid {
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    #workflow-governance-layers .wgl-a1-detail-grid {
      grid-template-columns: 1fr;
      margin: 0;
    }

    #workflow-governance-layers .wgl-a1-caption {
      color: var(--muted-foreground);
      text-align: center;
    }

    #workflow-governance-layers .wgl-a1-detail-grid div {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    #workflow-governance-layers .wgl-a1-detail-grid dt {
      color: var(--muted-foreground);
    }

    #workflow-governance-layers .wgl-a1-detail-grid dd {
      margin: 0;
      overflow-wrap: anywhere;
    }

    #workflow-governance-layers .wgl-stack {
      display: grid;
      gap: 24px;
      min-width: 0;
    }

    #workflow-governance-layers .wgl-tier {
      display: grid;
      grid-template-columns: 146px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
      min-width: 0;
    }

    #workflow-governance-layers .wgl-label {
      display: grid;
      gap: 3px;
      padding-top: 8px;
    }

    #workflow-governance-layers .wgl-content {
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    #workflow-governance-layers .wgl-path {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      min-width: 0;
      max-width: 100%;

      background: color-mix(in srgb, var(--viz-series-1) 9%, transparent);

      display: grid;
      gap: 7px;

      text-align: left;

      gap: 2px;
      min-width: 0;

      color: var(--muted-foreground);
    }

      justify-items: stretch;
      gap: 6px;
    }

    #workflow-governance-layers .wgl-b-flow-node {
      padding: 10px 12px;

      border-radius: 10px;
      background: color-mix(in srgb, var(--viz-series-1) 10%, transparent);
      text-align: center;
    }

    #workflow-governance-layers .wgl-b-flow-decision {
      background: color-mix(in srgb, var(--viz-series-2) 12%, transparent);
    }

      text-align: center;
    }

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

            &lt;div class=&quot;wgl-note text-small&quot;&gt;&lt;code&gt;proposed&lt;/code&gt; → &lt;code&gt;rejected&lt;/code&gt;；&lt;code&gt;proposed&lt;/code&gt; → &lt;code&gt;deferred&lt;/code&gt; → &lt;code&gt;proposed&lt;/code&gt;；&lt;code&gt;draft&lt;/code&gt; / &lt;code&gt;proposed&lt;/code&gt; / &lt;code&gt;deferred&lt;/code&gt; → &lt;code&gt;withdrawn&lt;/code&gt;。&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;wgl-note text-small&quot;&gt;目標漂移或部分狀態無效 → 阻止套用 → 重新預覽；不留下修改。&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;wgl-tier wgl-tier-l2&quot;&gt;
      &lt;div class=&quot;wgl-label&quot;&gt;&lt;strong&gt;L2｜發布授權&lt;/strong&gt;&lt;span&gt;用途：核准版本正式生效&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;wgl-content&quot;&gt;
        &lt;div class=&quot;wgl-path&quot;&gt;
          &lt;span class=&quot;wgl-node&quot;&gt;版本 &lt;code&gt;draft&lt;/code&gt;&lt;/span&gt;&lt;span class=&quot;wgl-arrow&quot;&gt;→ 發布檢查＋人類核准 →&lt;/span&gt;
          &lt;span class=&quot;wgl-node&quot;&gt;準備分支&lt;br&gt;&lt;code&gt;status = active&lt;/code&gt;&lt;br&gt;&lt;small&gt;尚無正式權威&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;wgl-arrow&quot;&gt;→ 合併 canonical branch →&lt;/span&gt;
          &lt;span class=&quot;wgl-node&quot;&gt;正式生效&lt;br&gt;&lt;code&gt;active&lt;/code&gt;&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;wgl-branches&quot;&gt;
          &lt;div class=&quot;wgl-note&quot;&gt;發布副作用：上一個 active → &lt;code&gt;superseded&lt;/code&gt;；accepted changes → &lt;code&gt;released&lt;/code&gt;。&lt;/div&gt;
          &lt;div class=&quot;wgl-note&quot;&gt;受控終點：版本 &lt;code&gt;active&lt;/code&gt; → 人類核准＋研究安全 → &lt;code&gt;retired&lt;/code&gt;。&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;wgl-tier wgl-tier-l3&quot;&gt;
      &lt;div class=&quot;wgl-label&quot;&gt;&lt;strong&gt;L3｜研究與審查&lt;/strong&gt;&lt;span&gt;用途：執行研究、獨立判定&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;wgl-content&quot;&gt;
        &lt;div class=&quot;wgl-path&quot;&gt;
          &lt;span class=&quot;wgl-node&quot;&gt;&lt;code&gt;draft&lt;/code&gt;&lt;/span&gt;&lt;span class=&quot;wgl-arrow&quot;&gt;→ 人類預註冊核准 →&lt;/span&gt;
          &lt;span class=&quot;wgl-node&quot;&gt;&lt;code&gt;preregistered&lt;/code&gt;&lt;/span&gt;&lt;span class=&quot;wgl-arrow&quot;&gt;→&lt;/span&gt;
          &lt;span class=&quot;wgl-node&quot;&gt;&lt;code&gt;running&lt;/code&gt;&lt;/span&gt;&lt;span class=&quot;wgl-arrow&quot;&gt;→&lt;/span&gt;
          &lt;span class=&quot;wgl-node&quot;&gt;&lt;code&gt;awaiting-review&lt;/code&gt;&lt;/span&gt;&lt;span class=&quot;wgl-arrow&quot;&gt;→ 獨立審查 →&lt;/span&gt;
          &lt;span class=&quot;wgl-node&quot;&gt;&lt;code&gt;completed&lt;/code&gt;&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;wgl-branches&quot;&gt;
          &lt;div class=&quot;wgl-note&quot;&gt;&lt;code&gt;running&lt;/code&gt; ↔ &lt;code&gt;paused&lt;/code&gt;；審查者可將 &lt;code&gt;awaiting-review&lt;/code&gt; → &lt;code&gt;running&lt;/code&gt;。&lt;/div&gt;
          &lt;div class=&quot;wgl-note&quot;&gt;&lt;code&gt;draft&lt;/code&gt; / &lt;code&gt;preregistered&lt;/code&gt; / &lt;code&gt;running&lt;/code&gt; / &lt;code&gt;paused&lt;/code&gt; → &lt;code&gt;cancelled&lt;/code&gt;。&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;wgl-outcomes&quot; aria-label=&quot;研究結論&quot;&gt;
          &lt;span class=&quot;wgl-node&quot;&gt;&lt;code&gt;pass&lt;/code&gt;&lt;/span&gt;
          &lt;span class=&quot;wgl-node&quot;&gt;&lt;code&gt;fail&lt;/code&gt;&lt;/span&gt;
          &lt;span class=&quot;wgl-node&quot;&gt;&lt;code&gt;insufficient-evidence&lt;/code&gt;&lt;/span&gt;
          &lt;span class=&quot;wgl-node&quot;&gt;&lt;code&gt;indeterminate&lt;/code&gt;&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;wgl-diagram&quot; aria-labelledby=&quot;wgl-sequence-title&quot;&gt;
    &lt;h2 id=&quot;wgl-sequence-title&quot;&gt;B1｜Sequence diagram：權限與交接&lt;/h2&gt;
    &lt;pre class=&quot;mermaid wgl-mermaid wgl-mermaid-b wgl-b-desktop-only&quot; data-diagram=&quot;b1-sequence&quot;&gt;
sequenceDiagram
    autonumber
    actor H as Human Author / Owner
    participant W as Workflow Service
    participant G as Canonical Git
    participant O as Study Operator
    participant V as Independent Reviewer

    Note over H,W: L1 流程設計｜首次建立與版本替換分開處理
    alt Initial family
        H-&gt;&gt;W: Create request → dry-run / confirm / apply
        W--&gt;&gt;H: v001 validated draft
    else Replacement version
        H-&gt;&gt;W: Change-create request → dry-run / apply
        W--&gt;&gt;H: Proposed Cxxx change
        H-&gt;&gt;W: Guarded change decision → accepted
        H-&gt;&gt;W: Evolve request → dry-run / confirm / apply
        W--&gt;&gt;H: Replacement validated draft
    end

    Note over H,G: L2 發布授權｜準備完成不等於正式生效
    H-&gt;&gt;W: Human release approval
    W--&gt;&gt;H: Prepared branch：registry status = active，authority 尚未生效
    H-&gt;&gt;G: Merge prepared commit to canonical
    G--&gt;&gt;H: Effective canonical authority

    Note over G,V: L3 研究與審查｜執行者做研究，審查者判定結果
    G--&gt;&gt;O: Active version + immutable pins
    O-&gt;&gt;W: Preregister → execute → submit evidence
    W--&gt;&gt;V: Frozen plan + exact evidence
    V--&gt;&gt;H: Terminal outcome
    &lt;/pre&gt;
    &lt;ol class=&quot;wgl-b-mobile-only wgl-b-mobile-sequence&quot; aria-label=&quot;B1：精簡版權限交接 sequence diagram&quot;&gt;
      &lt;li&gt;&lt;span class=&quot;wgl-b-step-number&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;wgl-b-message&quot;&gt;&lt;strong&gt;L1A｜流程設計：首次建立&lt;/strong&gt;&lt;span&gt;Create request → dry-run / confirm / apply → v001 draft。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;wgl-b-step-number&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;wgl-b-message&quot;&gt;&lt;strong&gt;L1B｜流程設計：版本變更&lt;/strong&gt;&lt;span&gt;Change-create request → proposed Cxxx。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;wgl-b-step-number&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;wgl-b-message&quot;&gt;&lt;strong&gt;Owner → Workflow Service&lt;/strong&gt;&lt;span&gt;Guarded change decision → accepted。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;wgl-b-step-number&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;wgl-b-message&quot;&gt;&lt;strong&gt;Author → Workflow Service&lt;/strong&gt;&lt;span&gt;Evolve request → dry-run / confirm / apply → replacement draft。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;wgl-b-step-number&quot;&gt;5&lt;/span&gt;&lt;span class=&quot;wgl-b-message&quot;&gt;&lt;strong&gt;L2｜發布授權&lt;/strong&gt;&lt;span&gt;Human release approval → prepared branch；registry status 已是 active，但 authority 尚未生效。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;wgl-b-step-number&quot;&gt;6&lt;/span&gt;&lt;span class=&quot;wgl-b-message&quot;&gt;&lt;strong&gt;Owner → Canonical Git&lt;/strong&gt;&lt;span&gt;Merge prepared commit 後，effective authority 才生效。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;wgl-b-step-number&quot;&gt;7&lt;/span&gt;&lt;span class=&quot;wgl-b-message&quot;&gt;&lt;strong&gt;L3｜研究與審查&lt;/strong&gt;&lt;span&gt;交付 active version 與 immutable pins。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;wgl-b-step-number&quot;&gt;8&lt;/span&gt;&lt;span class=&quot;wgl-b-message&quot;&gt;&lt;strong&gt;Operator → Reviewer&lt;/strong&gt;&lt;span&gt;依 frozen plan 執行並提交 exact evidence。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;wgl-b-step-number&quot;&gt;9&lt;/span&gt;&lt;span class=&quot;wgl-b-message&quot;&gt;&lt;strong&gt;Reviewer → Owner&lt;/strong&gt;&lt;span&gt;獨立判定 terminal outcome。&lt;/span&gt;&lt;/span&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/section&gt;

  &lt;section class=&quot;wgl-diagram&quot; aria-labelledby=&quot;wgl-activity-title&quot;&gt;
    &lt;h2 id=&quot;wgl-activity-title&quot;&gt;B2｜Activity diagram：生命週期與治理閘門&lt;/h2&gt;
    &lt;pre class=&quot;mermaid wgl-mermaid wgl-mermaid-b wgl-b-desktop-only&quot; data-diagram=&quot;b2-activity&quot;&gt;
flowchart TD
    ROOT([Workflow governance])

    subgraph L1[L1｜流程設計]
      A0{Initial 或 replacement?}
      A0 --&gt;|Initial| A1[Create request] --&gt; A2[Dry-run + confirm] --&gt; A3[v001 draft]
      A0 --&gt;|Replacement| A4[Change create] --&gt; A5[Human decision → accepted] --&gt; A6[Evolve + dry-run + confirm] --&gt; A7[Replacement draft]
    end

    subgraph L2[L2｜發布授權]
      direction LR

    ROOT --&gt; A0
    A3 --&gt;|draft handoff| B1

    B4 --&gt;|immutable pins| C1
    &lt;/pre&gt;
    &lt;div class=&quot;wgl-b-mobile-only wgl-b-mobile-flow&quot; role=&quot;img&quot; aria-label=&quot;B2：精簡版 workflow activity diagram&quot;&gt;
      &lt;div class=&quot;wgl-b-flow-node&quot;&gt;&lt;strong&gt;L1｜流程設計&lt;/strong&gt;&lt;br&gt;建立或修改流程，產生草稿&lt;/div&gt;
      &lt;div class=&quot;wgl-b-flow-branches&quot; aria-label=&quot;Authoring 路徑&quot;&gt;
        &lt;div class=&quot;wgl-b-flow-branch&quot;&gt;Initial&lt;br&gt;Create → preview/apply → v001 draft&lt;/div&gt;
        &lt;div class=&quot;wgl-b-flow-branch&quot;&gt;Replacement&lt;br&gt;Change → accepted → evolve → draft&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;wgl-b-flow-arrow&quot;&gt;↓ draft handoff&lt;/div&gt;
      &lt;div class=&quot;wgl-b-flow-node wgl-b-flow-authority&quot;&gt;&lt;strong&gt;L2｜發布授權&lt;/strong&gt;&lt;br&gt;核准版本；prepared branch 尚未生效，canonical merge 後才有正式權威&lt;/div&gt;
      &lt;div class=&quot;wgl-b-flow-arrow&quot;&gt;↓ immutable pins&lt;/div&gt;
      &lt;div class=&quot;wgl-b-flow-node wgl-b-flow-decision&quot;&gt;&lt;strong&gt;L3｜研究與審查&lt;/strong&gt;&lt;br&gt;依核准版本研究，由獨立審查者判定結果&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;script type=&quot;module&quot;&gt;
    const root = document.getElementById(&quot;workflow-governance-layers&quot;);
    const status = root.querySelector(&quot;#wgl-mermaid-status&quot;);
    const isMobileLayout = window.matchMedia(&quot;(max-width: 520px)&quot;).matches;
    const a1Diagrams = [...root.querySelectorAll(&quot;.wgl-mermaid-a1&quot;)];
    const bDiagrams = [...root.querySelectorAll(&quot;.wgl-mermaid-b&quot;)];
    const diagrams = isMobileLayout ? a1Diagrams : [...a1Diagrams, ...bDiagrams];
    const detailSelect = root.querySelector(&quot;#wgl-a1-detail-select&quot;);
    const detailTitle = root.querySelector(&quot;#wgl-a1-detail-title&quot;);
    const detailSummary = root.querySelector(&quot;#wgl-a1-detail-summary&quot;);
    const detailInput = root.querySelector(&quot;#wgl-a1-detail-input&quot;);
    const detailNext = root.querySelector(&quot;#wgl-a1-detail-next&quot;);
    const detailGuard = root.querySelector(&quot;#wgl-a1-detail-guard&quot;);
    const detailPanel = root.querySelector(&quot;#wgl-a1-detail-panel&quot;);

    const details = {
      N1: {
        title: &quot;A1-N1｜可能的輸入&quot;,
        summary: &quot;整理所有可能觸發 L1 authoring 的來源。&quot;,
        input: &quot;首次建立的新需求或來源文件；active workflow 的變更需求與人類 change decision；L3 conclusion 形成的新 change request；以及 L2 退回的缺口。&quot;,
        next: &quot;形成 closed create／change request，交給 AI 預覽與檢查。&quot;,
        guard: &quot;研究結論與 L2 退回都只能成為修正輸入，不能自動改動 workflow。&quot;
      },
      N2: {
        title: &quot;A1-N2｜AI 預覽與檢查&quot;,
        summary: &quot;AI 解析 repository facts、來源與預期修改，先產生不寫檔的 preview。&quot;,
        input: &quot;Closed request、目前 workflow registry、active version、來源文件與相關規則。&quot;,
        next: &quot;把 resolved changes、目標路徑、來源處置與驗證計畫交給人工確認。&quot;,
        guard: &quot;Target drift 或 invalid partial state 必須 fail closed；零 mutation，重新產生 fresh preview。&quot;
      },
      N3: {
        title: &quot;A1-N3｜人工確認&quot;,
        summary: &quot;人類確認 AI 已解析出的實際修改內容與範圍。&quot;,
        input: &quot;完整 preview、resolved changes、exact paths、source disposition 與 validation plan。&quot;,
        next: &quot;僅授權依該 preview 套用，建立或修正 registered draft。&quot;,
        guard: &quot;若 resolved changes 改變，原確認失效，必須 fresh preview 並重新確認；此確認不是 release approval。&quot;
      },
      N4: {
        title: &quot;A1-N4｜建立／修正草稿&quot;,
        summary: &quot;依已確認的 preview 套用變更並形成完整的 registered draft。&quot;,
        input: &quot;首次建立 request，或已 accepted change 經 evolve 形成的 replacement draft。&quot;,
        next: &quot;交給 L2 進行發布檢查。&quot;,
        guard: &quot;Draft 沒有 effective authority，也不能供新的 L3 study 使用。&quot;
      },
      N5: {
        title: &quot;A1-N5｜AI 發布檢查&quot;,
        summary: &quot;CLI 與 Agent 檢查 release guards 是否全部滿足。&quot;,
        input: &quot;完整 contract、accepted changes 與 combined impact、exact active version、unfinished-study state、exact policy／dependency pins。&quot;,
        next: &quot;全部通過後交給人類進行當下的發布核准。&quot;,
        guard: &quot;Contract／change／pins 缺口退回 L1；不安全 study 先由 L3 進入安全狀態並記錄 impact decision。&quot;
      },
      N6: {
        title: &quot;A1-N6｜人工發布核准&quot;,
        summary: &quot;人類以 stable identity 明確批准目前這一次 release preparation。&quot;,
        input: &quot;AI 發布檢查結果、完整 release scope 與 impact。&quot;,
        next: &quot;允許 guarded release command 準備 immutable release evidence。&quot;,
        guard: &quot;未核准就停止並返回 L1；核准只允許準備發布，不授權 commit、push、merge 或研究。&quot;
      },
      N7: {
        title: &quot;A1-N7｜準備發布&quot;,
        summary: &quot;Guarded release 產生 RELEASE.json 並準備 registry transition。&quot;,
        input: &quot;通過全部 guards 的 draft 與當下明確的人類發布核准。&quot;,
        next: &quot;Prepared branch 的 registry status 會是 active，等待 commit 進入 canonical branch。&quot;,
        guard: &quot;此時 authority 尚未生效；尚未 canonical merge 時禁止新的 L3 study。&quot;
      },
      N8: {
        title: &quot;A1-N8｜合併正式分支&quot;,
        summary: &quot;Prepared release commit 進入 repository canonical branch。&quot;,
        input: &quot;已準備完成且通過 repository review／merge 流程的 release commit。&quot;,
        next: &quot;Workflow version 取得 effective authority，可供新的 study 精確 pinning。&quot;,
        guard: &quot;Prepared branch 上的 active registry 狀態不能取代 canonical merge。&quot;
      },
      N9: {
        title: &quot;A1-N9｜研究與獨立審查&quot;,
        summary: &quot;L3 使用 exact active version 與 immutable pins 建立、執行及審查 study。&quot;,
        input: &quot;Effective canonical workflow authority、exact policies／dependencies，以及各階段必要的人類授權。&quot;,
        next: &quot;Operator 提交 evidence；獨立 reviewer 經人工確認後產生 terminal outcome。&quot;,
        guard: &quot;各階段 authority 不可互相推導；研究結論不能自動修改 workflow。&quot;
      },
      R1: {
        title: &quot;A1-R1｜返回 L1&quot;,
        summary: &quot;處理 contract、accepted change、impact、pins 或人類核准不足。&quot;,
        input: &quot;L2 的 fail-closed 缺口報告或未取得核准的結果。&quot;,
        next: &quot;回到 AI 預覽與檢查，修正後重新走人工確認與 L2。&quot;,
        guard: &quot;若修正後的 resolved changes 不同，必須 fresh preview 並重新確認。&quot;
      },
      R2: {
        title: &quot;A1-R2｜研究先安全化&quot;,
        summary: &quot;在版本邊界前先讓 unfinished studies 到達合法安全狀態。&quot;,
        input: &quot;Running、preregistered、draft 或 awaiting-review study 對 release 形成阻擋。&quot;,
        next: &quot;由 L3 合法進入 paused、completed 或 cancelled；記錄 continue、restart 或 close impact decision 後重試 L2。&quot;,
        guard: &quot;Workflow author 只能評估 impact，不能代替 operator／reviewer 操作、完成或重解釋 study。&quot;
      },
      R3: {
        title: &quot;A1-R3｜阻止新研究&quot;,
        summary: &quot;Prepared release 尚未進入 canonical branch 時維持 fail closed。&quot;,
        input: &quot;Registry 已在 prepared branch 顯示 active，但 commit 尚未 canonical merge。&quot;,
        next: &quot;等待正常 repository merge 流程；不建立新的 L3 study。&quot;,
        guard: &quot;不得把 prepared registry active 誤認為 effective authority。&quot;
      },
      R4: {
        title: &quot;A1-R4｜提出新變更&quot;,
        summary: &quot;把 L3 的研究結論轉成新的 workflow change request。&quot;,
        input: &quot;Pass、fail、insufficient-evidence 或 indeterminate conclusion 所揭示的流程改善需求。&quot;,
        next: &quot;回到 L1，建立獨立 change record 並重新經過 authoring 與 release governance。&quot;,
        guard: &quot;不得直接覆寫 released workflow，也不得讓 study outcome 自動變更 L1 或 L2。&quot;
      }
    };

    const showDetail = (nodeId) =&gt; {
      const detail = details[nodeId];
      if (!detail) return;
      detailSelect.value = nodeId;
      detailTitle.textContent = detail.title;
      detailSummary.textContent = detail.summary;
      detailInput.textContent = detail.input;
      detailNext.textContent = detail.next;
      detailGuard.textContent = detail.guard;
    };

    detailSelect.addEventListener(&quot;change&quot;, (event) =&gt; showDetail(event.target.value));
    showDetail(detailSelect.value);

    const colorCanvas = document.createElement(&quot;canvas&quot;);
    colorCanvas.width = 1;
    colorCanvas.height = 1;
    const colorContext = colorCanvas.getContext(&quot;2d&quot;, { willReadFrequently: true });

    const normalizeColor = (value) =&gt; {
      colorContext.clearRect(0, 0, 1, 1);
      colorContext.fillStyle = value;
      colorContext.fillRect(0, 0, 1, 1);
      const [red, green, blue, alpha] = colorContext.getImageData(0, 0, 1, 1).data;
      return `rgba(${red}, ${green}, ${blue}, ${alpha / 255})`;
    };

    const readColor = (name) =&gt; {
      const resolver = document.createElement(&quot;span&quot;);
      resolver.style.color = `var(${name})`;
      resolver.hidden = true;
      root.appendChild(resolver);
      const resolved = normalizeColor(getComputedStyle(resolver).color);
      resolver.remove();
      return resolved;
    };

    try {
      const module = await import(&quot;https://cdn.jsdelivr.net/npm/mermaid@11.12.0/+esm&quot;);
      const mermaid = module.default;
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: &quot;strict&quot;,
        theme: &quot;base&quot;,
        themeVariables: {
          background: &quot;transparent&quot;,
          primaryColor: readColor(&quot;--card&quot;),
          primaryTextColor: readColor(&quot;--card-foreground&quot;),
          primaryBorderColor: readColor(&quot;--border&quot;),
          secondaryColor: readColor(&quot;--muted&quot;),
          secondaryTextColor: readColor(&quot;--foreground&quot;),
          secondaryBorderColor: readColor(&quot;--border&quot;),
          tertiaryColor: readColor(&quot;--background&quot;),
          tertiaryTextColor: readColor(&quot;--foreground&quot;),
          tertiaryBorderColor: readColor(&quot;--border&quot;),
          lineColor: readColor(&quot;--muted-foreground&quot;),
          textColor: readColor(&quot;--foreground&quot;),
          clusterBkg: readColor(&quot;--background&quot;),
          clusterBorder: readColor(&quot;--border&quot;),
          edgeLabelBackground: readColor(&quot;--background&quot;),
          actorBkg: readColor(&quot;--card&quot;),
          actorBorder: readColor(&quot;--border&quot;),
          actorTextColor: readColor(&quot;--card-foreground&quot;),
          actorLineColor: readColor(&quot;--border&quot;),
          signalColor: readColor(&quot;--foreground&quot;),
          signalTextColor: readColor(&quot;--foreground&quot;),
          labelBoxBkgColor: readColor(&quot;--muted&quot;),
          labelBoxBorderColor: readColor(&quot;--border&quot;),
          labelTextColor: readColor(&quot;--foreground&quot;),
          loopTextColor: readColor(&quot;--foreground&quot;),
          noteBkgColor: readColor(&quot;--accent&quot;),
          noteBorderColor: readColor(&quot;--border&quot;),
          noteTextColor: readColor(&quot;--accent-foreground&quot;),
          fontSize: &quot;13px&quot;
        },
        flowchart: {
          curve: &quot;basis&quot;,
          htmlLabels: true,
          nodeSpacing: isMobileLayout ? 18 : 26,
          rankSpacing: isMobileLayout ? 28 : 34,
          padding: 10,
          useMaxWidth: true
        },
        sequence: {
          useMaxWidth: true,
          actorMargin: 28,
          messageMargin: 24,
          diagramMarginX: 8,
          diagramMarginY: 8
        }
      });

      await mermaid.run({ nodes: diagrams });
      const svgs = diagrams.map((item) =&gt; item.querySelector(&quot;svg&quot;));
      svgs.forEach((svg, index) =&gt; {
        const diagramName = diagrams[index].dataset.diagram;
        svg.setAttribute(&quot;role&quot;, &quot;img&quot;);
        const labels = {
          &quot;a1-main&quot;: &quot;A1：簡化節點顯示 L1 authoring、L2 release authority 與 L3 research review；每個節點可開啟詳細說明&quot;,
          &quot;a1-exceptions&quot;: &quot;A1：L2 返回、研究安全化、阻止新研究與提出新變更的例外路徑；每個節點可開啟詳細說明&quot;,
          &quot;b1-sequence&quot;: &quot;B1：Human Author、Workflow Service、Canonical Git、Study Operator 與 Independent Reviewer 的權限交接順序&quot;,
          &quot;b2-activity&quot;: &quot;B2：L1 流程設計、L2 發布授權與 L3 研究審查的生命週期與治理閘門&quot;
        };
        svg.setAttribute(&quot;aria-label&quot;, labels[diagramName]);
        svg.removeAttribute(&quot;height&quot;);
      });

      Object.entries(details).forEach(([nodeId, detail]) =&gt; {
        const node = svgs
          .flatMap((svg) =&gt; [...svg.querySelectorAll(&quot;g.node&quot;)])
          .find((candidate) =&gt; candidate.id.startsWith(`flowchart-${nodeId}-`));
        if (!node) return;
        const link = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;a&quot;);
        const title = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;title&quot;);
        title.textContent = `查看 ${detail.title} 的詳細說明`;
        link.setAttribute(&quot;href&quot;, &quot;#wgl-a1-detail-panel&quot;);
        link.setAttribute(&quot;aria-label&quot;, title.textContent);
        link.classList.add(&quot;wgl-node-link&quot;);
        node.parentNode.insertBefore(link, node);
        link.append(title, node);
        link.addEventListener(&quot;pointerenter&quot;, () =&gt; {
          if (window.matchMedia(&quot;(hover: hover)&quot;).matches) showDetail(nodeId);
        });
        link.addEventListener(&quot;focus&quot;, () =&gt; showDetail(nodeId));
        link.addEventListener(&quot;click&quot;, (event) =&gt; {
          event.preventDefault();
          showDetail(nodeId);
          if (isMobileLayout) detailPanel.scrollIntoView({ block: &quot;start&quot; });
        });
      });

      status.textContent = isMobileLayout
        ? &quot;點選 A1 節點，可在下方查看詳細說明。&quot;
        : &quot;將滑鼠移到、聚焦或點選 A1 節點，可在右欄查看詳細說明。&quot;;
    } catch (error) {
      console.error(error);
      status.textContent = &quot;A1 載入失敗；上方保留可讀的 Mermaid source。&quot;;
      status.classList.add(&quot;text-destructive&quot;);
    }
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
