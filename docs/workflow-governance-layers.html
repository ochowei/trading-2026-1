:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {

  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {

  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {

}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;

  border: 1px solid var(--input);

}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);

  color: var(--muted-foreground);
  background: transparent;

  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);

  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);

  background: var(--secondary);
  cursor: inherit;
  font: inherit;

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {

  min-height: 72px;
  padding: 8px 10px;

.form-control:focus-visible {

  background-color: var(--secondary);

.form-select:not(:disabled):hover {

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);

  border: 1px solid var(--input);
  color: var(--primary-foreground);

  transition:

}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected

}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {

  outline-offset: 2px;
}

svg {

#widget &gt; svg {

svg.lucide {

  margin: 0 !important;

}

        &lt;/div&gt;
        &lt;div class=&quot;wgl-note text-small&quot;&gt;目標漂移或部分狀態無效 → 阻止套用 → 重新預覽；不留下修改。&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;wgl-tier wgl-tier-l2&quot;&gt;
      &lt;div class=&quot;wgl-label&quot;&gt;&lt;strong&gt;L2｜發布授權&lt;/strong&gt;&lt;span&gt;用途：核准版本正式生效&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;wgl-content&quot;&gt;
        &lt;div class=&quot;wgl-path&quot;&gt;
          &lt;span class=&quot;wgl-node&quot;&gt;版本 &lt;code&gt;draft&lt;/code&gt;&lt;/span&gt;&lt;span class=&quot;wgl-arrow&quot;&gt;→ 發布檢查＋人類核准 →&lt;/span&gt;
          &lt;span class=&quot;wgl-node&quot;&gt;準備分支&lt;br&gt;&lt;code&gt;status = active&lt;/code&gt;&lt;br&gt;&lt;small&gt;尚無正式權威&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;wgl-arrow&quot;&gt;→ 合併 canonical branch →&lt;/span&gt;
          &lt;span class=&quot;wgl-node&quot;&gt;正式生效&lt;br&gt;&lt;code&gt;active&lt;/code&gt;&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;wgl-branches&quot;&gt;
          &lt;div class=&quot;wgl-note&quot;&gt;發布副作用：上一個 active → &lt;code&gt;superseded&lt;/code&gt;；accepted changes → &lt;code&gt;released&lt;/code&gt;。&lt;/div&gt;
          &lt;div class=&quot;wgl-note&quot;&gt;受控終點：版本 &lt;code&gt;active&lt;/code&gt; → 人類核准＋研究安全 → &lt;code&gt;retired&lt;/code&gt;。&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;wgl-tier wgl-tier-l3&quot;&gt;
      &lt;div class=&quot;wgl-label&quot;&gt;&lt;strong&gt;L3｜研究與審查&lt;/strong&gt;&lt;span&gt;用途：執行研究、獨立判定&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;wgl-content&quot;&gt;
        &lt;div class=&quot;wgl-path&quot;&gt;
          &lt;span class=&quot;wgl-node&quot;&gt;&lt;code&gt;draft&lt;/code&gt;&lt;/span&gt;&lt;span class=&quot;wgl-arrow&quot;&gt;→ 人類預註冊核准 →&lt;/span&gt;
          &lt;span class=&quot;wgl-node&quot;&gt;&lt;code&gt;preregistered&lt;/code&gt;&lt;/span&gt;&lt;span class=&quot;wgl-arrow&quot;&gt;→&lt;/span&gt;
          &lt;span class=&quot;wgl-node&quot;&gt;&lt;code&gt;running&lt;/code&gt;&lt;/span&gt;&lt;span class=&quot;wgl-arrow&quot;&gt;→&lt;/span&gt;
          &lt;span class=&quot;wgl-node&quot;&gt;&lt;code&gt;awaiting-review&lt;/code&gt;&lt;/span&gt;&lt;span class=&quot;wgl-arrow&quot;&gt;→ 獨立審查 →&lt;/span&gt;
          &lt;span class=&quot;wgl-node&quot;&gt;&lt;code&gt;completed&lt;/code&gt;&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;wgl-branches&quot;&gt;
          &lt;div class=&quot;wgl-note&quot;&gt;&lt;code&gt;running&lt;/code&gt; ↔ &lt;code&gt;paused&lt;/code&gt;；審查者可將 &lt;code&gt;awaiting-review&lt;/code&gt; → &lt;code&gt;running&lt;/code&gt;。&lt;/div&gt;
          &lt;div class=&quot;wgl-note&quot;&gt;&lt;code&gt;draft&lt;/code&gt; / &lt;code&gt;preregistered&lt;/code&gt; / &lt;code&gt;running&lt;/code&gt; / &lt;code&gt;paused&lt;/code&gt; → &lt;code&gt;cancelled&lt;/code&gt;。&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;wgl-outcomes&quot; aria-label=&quot;研究結論&quot;&gt;
          &lt;span class=&quot;wgl-node&quot;&gt;&lt;code&gt;pass&lt;/code&gt;&lt;/span&gt;
          &lt;span class=&quot;wgl-node&quot;&gt;&lt;code&gt;fail&lt;/code&gt;&lt;/span&gt;
          &lt;span class=&quot;wgl-node&quot;&gt;&lt;code&gt;insufficient-evidence&lt;/code&gt;&lt;/span&gt;
          &lt;span class=&quot;wgl-node&quot;&gt;&lt;code&gt;indeterminate&lt;/code&gt;&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;/div&gt;
  &lt;/section&gt;

  &lt;script type=&quot;module&quot;&gt;
    const root = document.getElementById(&quot;workflow-governance-layers&quot;);
    const status = root.querySelector(&quot;#wgl-mermaid-status&quot;);
    const isMobileLayout = window.matchMedia(&quot;(max-width: 520px)&quot;).matches;
    const isTwoColumnLayout = window.matchMedia(&quot;(min-width: 900px)&quot;).matches;
    const diagrams = [...root.querySelectorAll(&quot;.wgl-mermaid-a1&quot;)];
    const detailSelect = root.querySelector(&quot;#wgl-a1-detail-select&quot;);
    const detailTitle = root.querySelector(&quot;#wgl-a1-detail-title&quot;);
    const detailSummary = root.querySelector(&quot;#wgl-a1-detail-summary&quot;);
    const detailInput = root.querySelector(&quot;#wgl-a1-detail-input&quot;);
    const detailNext = root.querySelector(&quot;#wgl-a1-detail-next&quot;);
    const detailGuard = root.querySelector(&quot;#wgl-a1-detail-guard&quot;);
    const detailPanel = root.querySelector(&quot;#wgl-a1-detail-panel&quot;);

    const details = {
      L1N1: {
        title: &quot;L1-N1｜可能的輸入&quot;,
        summary: &quot;彙整所有可能觸發 workflow 建立或修改的來源。&quot;,
        input: &quot;首次建立需求、active workflow 的變更需求、L2 退回缺口，以及 L3 結論形成的新 change request。&quot;,
        next: &quot;形成 closed create／change request，交給 AI 預覽與檢查。&quot;,
        guard: &quot;L2 退回與 L3 結論只能成為輸入，不能自動改動 workflow。&quot;
      },
      L1N2: {
        title: &quot;L1-N2｜AI 預覽與檢查&quot;,
        summary: &quot;AI 解析 repository facts 與要求，產生不寫檔的 preview。&quot;,
        input: &quot;Closed request、registry、active version、來源文件與治理規則。&quot;,
        next: &quot;檢查 preview 是否完整、可套用且目標狀態沒有漂移。&quot;,
        guard: &quot;Target drift 或 invalid partial state 必須 fail closed、零 mutation，並重新產生 fresh preview。&quot;
      },
      L1N3: {
        title: &quot;L1-N3｜預覽可套用？&quot;,
        summary: &quot;判斷 preview 是否完整且仍對應目前 repository 狀態。&quot;,
        input: &quot;Resolved changes、exact paths、target digests、source disposition 與 validation plan。&quot;,
        next: &quot;通過則交給人類確認；失敗則修正輸入並回到 fresh preview。&quot;,
        guard: &quot;不得繞過 drift 或 partial-state guard，也不得留下部分修改。&quot;
      },
      L1N4: {
        title: &quot;L1-N4｜人工確認？&quot;,
        summary: &quot;人類確認 AI 已解析出的實際修改內容與範圍。&quot;,
        input: &quot;完整 preview、resolved changes、目標路徑、來源處置與驗證計畫。&quot;,
        next: &quot;確認後僅授權依該 preview 套用；要求修改則返回 preview。&quot;,
        guard: &quot;Resolved changes 一旦改變，原確認失效；此確認也不是 release approval。&quot;
      },
      L1N5: {
        title: &quot;L1-N5｜建立／修正草稿&quot;,
        summary: &quot;依已確認的 preview 形成完整 registered draft。&quot;,
        input: &quot;首次建立 request，或 change accepted 後經 evolve 形成的 replacement draft。&quot;,
        next: &quot;以 draft handoff 交給 L2 發布檢查。&quot;,
        guard: &quot;Draft 沒有 effective authority，也不能供新的 L3 study 使用。&quot;
      },
      L1N6: {
        title: &quot;L1-N6｜修正輸入&quot;,
        summary: &quot;處理 preview 失敗或人類要求調整的內容。&quot;,
        input: &quot;缺漏、衝突、target drift、invalid partial state 或人工修改意見。&quot;,
        next: &quot;重新整理 request，回到 L1-N2 產生 fresh preview。&quot;,
        guard: &quot;若 resolved changes 不同，必須重新取得人工確認。&quot;
      },
      L2N1: {
        title: &quot;L2-N1｜AI 發布檢查&quot;,
        summary: &quot;CLI 與 Agent 檢查所有 release guards。&quot;,
        input: &quot;完整 contract、accepted changes 與 combined impact、exact active version、study 狀態、policy／dependency pins。&quot;,
        next: &quot;將結果交給發布條件判斷。&quot;,
        guard: &quot;任何缺口都必須 fail closed；AI 檢查不能取代人類發布核准。&quot;
      },
      L2N2: {
        title: &quot;L2-N2｜發布條件通過？&quot;,
        summary: &quot;區分可發布、需要回 L1 修正，以及需要先安全化研究的情況。&quot;,
        input: &quot;L2-N1 的完整 release-readiness 結果。&quot;,
        next: &quot;通過則請求人類核准；草稿／變更／pins 缺口退回 L1；不安全 study 轉至 L3-N1。&quot;,
        guard: &quot;Running、preregistered、draft 或 awaiting-review study 會阻擋版本邊界。&quot;
      },
      L2N3: {
        title: &quot;L2-N3｜人工發布核准？&quot;,
        summary: &quot;人類以 stable identity 明確批准目前這一次 release preparation。&quot;,
        input: &quot;完整 release scope、readiness 結果與 combined impact。&quot;,
        next: &quot;核准後準備 immutable release evidence；未核准則退回 L1。&quot;,
        guard: &quot;核准只允許準備發布，不授權 commit、push、merge、研究或交易。&quot;
      },
      L2N4: {
        title: &quot;L2-N4｜準備發布&quot;,
        summary: &quot;Guarded release 產生 RELEASE.json 並準備 registry transition。&quot;,
        input: &quot;通過所有 guards 的 draft 與當下明確的人類發布核准。&quot;,
        next: &quot;Prepared branch 的 registry status 成為 active，等待 canonical merge。&quot;,
        guard: &quot;此時 effective authority 尚未生效。&quot;
      },
      L2N5: {
        title: &quot;L2-N5｜已合併正式分支？&quot;,
        summary: &quot;確認 prepared release commit 是否已進入 canonical branch。&quot;,
        input: &quot;Prepared release commit 與 repository canonical branch 狀態。&quot;,
        next: &quot;已合併則權威生效；尚未合併則阻止新的 L3 study。&quot;,
        guard: &quot;Prepared branch 上的 active registry 狀態不能取代 canonical merge。&quot;
      },
      L2N6: {
        title: &quot;L2-N6｜正式權威生效&quot;,
        summary: &quot;Canonical branch 上的 active version 成為新的 effective authority。&quot;,
        input: &quot;已合併的 prepared release、immutable release evidence 與 exact pins。&quot;,
        next: &quot;允許 L3 依 exact version 與 immutable pins 建立 study。&quot;,
        guard: &quot;Authority 只適用於精確釘選的 released version 與 dependencies。&quot;
      },
      L2N7: {
        title: &quot;L2-N7｜退回 L1&quot;,
        summary: &quot;處理 contract、accepted change、impact、pins 或發布核准不足。&quot;,
        input: &quot;L2 的 fail-closed 缺口報告或未取得核准的結果。&quot;,
        next: &quot;回到 L1-N2；修正 request 後重新 preview、確認及發布檢查。&quot;,
        guard: &quot;不得直接修改 prepared release evidence 或繞過重新確認。&quot;
      },
      L2N8: {
        title: &quot;L2-N8｜阻止新研究&quot;,
        summary: &quot;Prepared release 尚未 canonical merge 時維持 fail closed。&quot;,
        input: &quot;Registry 已顯示 active，但 release commit 尚未進入 canonical branch。&quot;,
        next: &quot;等待正常 repository merge 流程，再重新檢查 L2-N5。&quot;,
        guard: &quot;不得把 prepared registry active 誤認為 effective authority。&quot;
      },
      L3N1: {
        title: &quot;L3-N1｜研究先安全化&quot;,
        summary: &quot;版本邊界前先讓 unfinished studies 到達合法安全狀態。&quot;,
        input: &quot;阻擋 release 的 running、preregistered、draft 或 awaiting-review study。&quot;,
        next: &quot;由 operator／reviewer 合法進入 paused、completed 或 cancelled，記錄 impact decision 後重試 L2。&quot;,
        guard: &quot;Workflow author 不能代替 operator／reviewer 操作、完成或重解釋 study。&quot;
      },
      L3N2: {
        title: &quot;L3-N2｜預註冊&quot;,
        summary: &quot;在 outcome-relevant execution 或 inspection 前凍結 study identity 與 plan。&quot;,
        input: &quot;Effective canonical workflow authority、exact policies／dependencies 與人類 preregistration approval。&quot;,
        next: &quot;依 frozen plan 推進各研究階段。&quot;,
        guard: &quot;Preregistration、Development、candidate freeze 與 Evaluation 的 authority 不可互相推導。&quot;
      },
      L3N3: {
        title: &quot;L3-N3｜執行與證據&quot;,
        summary: &quot;Operator 依 frozen plan 執行研究並提交 exact evidence。&quot;,
        input: &quot;Preregistered study、各階段必要的人類批准、immutable pins 與 frozen outcome rules。&quot;,
        next: &quot;完成後提交 awaiting-review；被 reviewer 退回時補充合法 evidence。&quot;,
        guard: &quot;不得修改 preregistered hypothesis、plan 或 outcome rules。&quot;
      },
      L3N4: {
        title: &quot;L3-N4｜獨立審查&quot;,
        summary: &quot;獨立 reviewer 對 frozen plan 與 exact evidence 作出判定。&quot;,
        input: &quot;Awaiting-review study、frozen evidence、workflow version 與 outcome rules。&quot;,
        next: &quot;證據不足或需補充時退回 running；完成時形成 terminal outcome。&quot;,
        guard: &quot;Reviewer 完成 outcome 前需要明確確認，且不能執行研究或修補 evidence。&quot;
      },
      L3N5: {
        title: &quot;L3-N5｜終局結論&quot;,
        summary: &quot;凍結 pass、fail、insufficient-evidence 或 indeterminate outcome。&quot;,
        input: &quot;Independent reviewer 的明確確認與完成的 evidence assessment。&quot;,
        next: &quot;研究結束；若揭示流程改善需求，建立新的 change request 回到 L1-N1。&quot;,
        guard: &quot;Study outcome 不得自動覆寫 released workflow 或改變 L1／L2 authority。&quot;
      }
    };

    const showDetail = (nodeId) =&gt; {
      const detail = details[nodeId];
      if (!detail) return;
      detailSelect.value = nodeId;
      detailTitle.textContent = detail.title;
      detailSummary.textContent = detail.summary;
      detailInput.textContent = detail.input;
      detailNext.textContent = detail.next;
      detailGuard.textContent = detail.guard;
    };

    detailSelect.addEventListener(&quot;change&quot;, (event) =&gt; showDetail(event.target.value));
    showDetail(detailSelect.value);

    const colorCanvas = document.createElement(&quot;canvas&quot;);
    colorCanvas.width = 1;
    colorCanvas.height = 1;
    const colorContext = colorCanvas.getContext(&quot;2d&quot;, { willReadFrequently: true });

    const normalizeColor = (value) =&gt; {
      colorContext.clearRect(0, 0, 1, 1);
      colorContext.fillStyle = value;
      colorContext.fillRect(0, 0, 1, 1);
      const [red, green, blue, alpha] = colorContext.getImageData(0, 0, 1, 1).data;
      return `rgba(${red}, ${green}, ${blue}, ${alpha / 255})`;
    };

    const readColor = (name) =&gt; {
      const resolver = document.createElement(&quot;span&quot;);
      resolver.style.color = `var(${name})`;
      resolver.hidden = true;
      root.appendChild(resolver);
      const resolved = normalizeColor(getComputedStyle(resolver).color);
      resolver.remove();
      return resolved;
    };

    try {
      const module = await import(&quot;https://cdn.jsdelivr.net/npm/mermaid@11.12.0/+esm&quot;);
      const mermaid = module.default;
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: &quot;strict&quot;,
        theme: &quot;base&quot;,
        themeVariables: {
          background: &quot;transparent&quot;,
          primaryColor: readColor(&quot;--card&quot;),
          primaryTextColor: readColor(&quot;--card-foreground&quot;),
          primaryBorderColor: readColor(&quot;--border&quot;),
          secondaryColor: readColor(&quot;--muted&quot;),
          secondaryTextColor: readColor(&quot;--foreground&quot;),
          secondaryBorderColor: readColor(&quot;--border&quot;),
          tertiaryColor: readColor(&quot;--background&quot;),
          tertiaryTextColor: readColor(&quot;--foreground&quot;),
          tertiaryBorderColor: readColor(&quot;--border&quot;),
          lineColor: readColor(&quot;--muted-foreground&quot;),
          textColor: readColor(&quot;--foreground&quot;),
          clusterBkg: readColor(&quot;--background&quot;),
          clusterBorder: readColor(&quot;--border&quot;),
          edgeLabelBackground: readColor(&quot;--background&quot;),
          fontSize: &quot;14px&quot;
        },
        flowchart: {
          curve: &quot;basis&quot;,
          htmlLabels: true,
          nodeSpacing: isMobileLayout ? 18 : 26,
          rankSpacing: isMobileLayout ? 28 : 34,
          padding: 10,
          useMaxWidth: true
        }
      });

      await mermaid.run({ nodes: diagrams });
      const svgs = diagrams.map((item) =&gt; item.querySelector(&quot;svg&quot;));
      svgs.forEach((svg) =&gt; {
        svg.setAttribute(&quot;role&quot;, &quot;img&quot;);
        svg.setAttribute(&quot;aria-label&quot;, &quot;A1：L1 流程設計、L2 發布授權與 L3 研究審查的治理流程、判斷與例外回復路徑；每個節點可開啟詳細說明&quot;);
        svg.removeAttribute(&quot;height&quot;);
      });

      Object.entries(details).forEach(([nodeId, detail]) =&gt; {
        const node = svgs
          .flatMap((svg) =&gt; [...svg.querySelectorAll(&quot;g.node&quot;)])
          .find((candidate) =&gt; candidate.id.startsWith(`flowchart-${nodeId}-`));
        if (!node) return;
        const link = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;a&quot;);
        const title = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;title&quot;);
        title.textContent = `查看 ${detail.title} 的詳細說明`;
        link.setAttribute(&quot;href&quot;, &quot;#wgl-a1-detail-panel&quot;);
        link.setAttribute(&quot;aria-label&quot;, title.textContent);
        link.classList.add(&quot;wgl-node-link&quot;);
        node.parentNode.insertBefore(link, node);
        link.append(title, node);
        link.addEventListener(&quot;pointerenter&quot;, () =&gt; {
          if (window.matchMedia(&quot;(hover: hover)&quot;).matches) showDetail(nodeId);
        });
        link.addEventListener(&quot;focus&quot;, () =&gt; showDetail(nodeId));
        link.addEventListener(&quot;click&quot;, (event) =&gt; {
          event.preventDefault();
          showDetail(nodeId);
          if (!isTwoColumnLayout) detailPanel.scrollIntoView({ block: &quot;start&quot; });
        });
      });

      status.textContent = !isTwoColumnLayout
        ? &quot;點選 A1 節點，可在下方查看詳細說明。&quot;
        : &quot;將滑鼠移到、聚焦或點選 A1 節點，可在右欄查看詳細說明。&quot;;
    } catch (error) {
      console.error(error);
      status.textContent = &quot;A1 載入失敗；上方保留可讀的 Mermaid source。&quot;;
      status.classList.add(&quot;text-destructive&quot;);
    }
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
