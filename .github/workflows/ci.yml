name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.8"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check src/

      - name: Format check
        run: uv run ruff format --check src/

      - name: Workflow contract validation
        run: uv run trading workflow validate --all

      - name: Policy contract validation
        run: uv run trading policy validate --all

      - name: Path ownership contract
        run: |
          uv run python config/repository-checks/check_path_ownership.py
          uv run pytest -q tests/repository_checks/test_path_ownership.py

      - name: Workflow authoring and study lifecycle tests
        run: uv run pytest -q tests/test_workflow_authoring.py

      - name: Policy authoring and composition tests
        run: uv run pytest -q tests/policies

      - name: Closed legacy experiment inventory
        run: |
          uv run python config/repository-checks/check_legacy_experiment_inventory.py
          uv run pytest -q tests/legacy/test_legacy_experiment_inventory.py

      - name: Market-data boundary policy
        run: uv run python config/repository-checks/check_experiment_market_data_access.py

      - name: Market-data boundary policy tests
        run: uv run pytest -q tests/market_data/test_market_data_migration_policy.py
