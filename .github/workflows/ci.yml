name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.8"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check src/

      - name: Format check
        run: uv run ruff format --check src/

      - name: Workflow contract validation
        run: uv run trading workflow validate --all

      - name: Policy contract validation
        run: uv run trading policy validate --all

      - name: Workflow authoring and study lifecycle tests
        run: uv run pytest -q tests/test_workflow_authoring.py

      - name: Policy authoring and composition tests
        run: uv run pytest -q tests/test_policy_authoring.py tests/policies

      - name: Closed legacy experiment inventory
        run: |
          uv run python tools/check_legacy_experiment_inventory.py
          uv run pytest -q tests/test_legacy_experiment_inventory.py

      - name: Phase 9 market-data bypass policy
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_allowlist="$RUNNER_TEMP/phase9-base-allowlist.json"
            if git cat-file -e "${{ github.event.pull_request.base.sha }}:ci/market-data-bypass-allowlist.json" 2>/dev/null; then
              git show "${{ github.event.pull_request.base.sha }}:ci/market-data-bypass-allowlist.json" > "$base_allowlist"
              uv run python tools/check_experiment_market_data_access.py \
                --allowlist ci/market-data-bypass-allowlist.json \
                --base-allowlist "$base_allowlist"
            else
              uv run python tools/check_experiment_market_data_access.py \
                --allowlist ci/market-data-bypass-allowlist.json
            fi
          else
            uv run python tools/check_experiment_market_data_access.py \
              --allowlist ci/market-data-bypass-allowlist.json
          fi

      - name: Phase 9 market-data policy tests
        run: uv run pytest -q tests/test_market_data_migration_policy.py
