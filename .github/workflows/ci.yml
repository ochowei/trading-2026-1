name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.8"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check src/

      - name: Format check
        run: uv run ruff format --check src/

      - name: Fast regression suite
        run: uv run pytest -m "not slow" --durations=25

      - name: Workflow contract validation
        run: uv run trading workflow validate --all

      - name: Policy contract validation
        run: uv run trading policy validate --all

      - name: Path ownership contract
        run: uv run python config/repository-checks/check_path_ownership.py

      - name: Closed legacy experiment inventory
        run: uv run python config/repository-checks/check_legacy_experiment_inventory.py

      - name: Market-data boundary policy
        run: uv run python config/repository-checks/check_experiment_market_data_access.py
