name: Auxiliary legacy conformance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/auxiliary-legacy-conformance.yml"
      - "legacy/experiments/**"
      - "src/trading/experiments/**"
      - "src/trading/legacy/experiments.py"
      - "src/trading/core/base_*.py"
      - "src/trading/core/bundle_strategy.py"
      - "src/trading/core/data_fetcher.py"
      - "src/trading/core/execution_*.py"
      - "src/trading/core/sleeve_engine.py"
      - "src/trading/market_data/**"
      - "src/trading/research_data/**"
      - "tests/conftest.py"
      - "tests/legacy/conformance/test_auxiliary_followup_snapshot_contract.py"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches: [main]
    types: [labeled]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: auxiliary-legacy-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    name: Auxiliary legacy conformance
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'full-auxiliary-conformance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.8"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run full auxiliary matrix
        run: >-
          uv run pytest -q -n auto -m legacy_conformance
          tests/legacy/conformance/test_auxiliary_followup_snapshot_contract.py --durations=25
